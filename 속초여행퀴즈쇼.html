<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF6F3">
<title>속초 2일, 우리 둘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   토큰
   ───────────────────────────────────────────── */
:root{
  --deep:#1F4E52;      /* 잉크 */
  --sea:#6FC7BE;       /* 청록 */
  --sea-2:#A8E0D8;     /* 옅은 청록 */
  --sand:#F3E3C9;      /* 모래 */
  --cream:#FFFAF2;     /* 크림 */
  --coral:#FF8F6B;     /* 산호 */
  --bg:#EAF6F3;
  --muted:#6E8A8C;

  --r:26px;
  --clay: 7px 7px 15px rgba(90,130,130,.20),
          -6px -6px 13px rgba(255,255,255,.92);
  --clay-in: inset 4px 4px 9px rgba(90,130,130,.18),
             inset -4px -4px 9px rgba(255,255,255,.90);
  --clay-sm: 4px 4px 9px rgba(90,130,130,.18),
             -3px -3px 8px rgba(255,255,255,.90);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--deep);
  font-family:'Gowun Dodum',system-ui,sans-serif;
  font-size:16px; line-height:1.65;
  padding:0 0 148px;
  overscroll-behavior-y:contain;
}
h1,h2,h3,.jua,button,.tab{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}

/* ─────────────────────────────────────────────
   헤더 — 밀물선
   ───────────────────────────────────────────── */
header{padding:26px 0 14px;position:relative}
header .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.14em}
header h1{font-size:27px;margin:2px 0 12px;line-height:1.25}
.tide{height:10px;border-radius:99px;background:var(--sand);box-shadow:var(--clay-in);overflow:hidden}
.tide i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--sea-2),var(--sea));
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
.tide-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}

/* ─────────────────────────────────────────────
   공통 부품
   ───────────────────────────────────────────── */
.card{background:var(--cream);border-radius:var(--r);box-shadow:var(--clay);padding:20px;margin:16px 0}
.card.tight{padding:16px}
.pill{display:inline-block;background:var(--sea-2);color:var(--deep);
  border-radius:99px;padding:3px 12px;font-size:12px;box-shadow:var(--clay-sm)}
.pill.sand{background:var(--sand)}
.pill.coral{background:var(--coral);color:#fff}
.pill.ghost{background:transparent;box-shadow:none;color:var(--muted);padding-left:0}

button{
  font-size:16px;border:0;cursor:pointer;color:var(--deep);
  background:var(--cream);border-radius:18px;padding:13px 18px;
  box-shadow:var(--clay-sm);transition:transform .12s, box-shadow .12s;
}
button:active{transform:translateY(2px);box-shadow:var(--clay-in)}
button:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
button.primary{background:linear-gradient(150deg,var(--sea),#57B4AC);color:#fff}
button.coral{background:var(--coral);color:#fff}
button.wide{display:block;width:100%}
button[disabled]{opacity:.45;cursor:not-allowed}
button.sel{box-shadow:var(--clay-in);background:var(--sea-2)}

input,textarea,select{
  font-family:inherit;font-size:16px;color:var(--deep);width:100%;
  background:var(--bg);border:0;border-radius:16px;padding:13px 15px;
  box-shadow:var(--clay-in);outline:none;
}
input:focus,textarea:focus{outline:2px solid var(--sea);outline-offset:2px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.muted{color:var(--muted);font-size:13.5px}
.center{text-align:center}

/* ─────────────────────────────────────────────
   타임라인
   ───────────────────────────────────────────── */
.slot{display:flex;gap:14px;align-items:stretch;margin:14px 0;text-align:left;width:100%;
  background:var(--cream);border-radius:22px;box-shadow:var(--clay);padding:15px 16px}
.slot .t{font-family:'Jua';font-size:13px;color:var(--sea);min-width:44px;padding-top:2px}
.slot .body{flex:1}
.slot .place{font-family:'Jua';font-size:17px;display:block}
.slot .desc{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.slot .mark{align-self:center;font-size:19px}
.slot.done{background:var(--sand)}
.slot.locked{opacity:.55}
.day-head{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.day-head h2{font-size:19px;margin:0}
.day-head hr{flex:1;border:0;height:4px;border-radius:99px;background:var(--sand);box-shadow:var(--clay-in)}

/* ─────────────────────────────────────────────
   시그니처 — 조개 봉인
   ───────────────────────────────────────────── */
.shell{position:relative;border-radius:24px;padding:18px;background:var(--sand);box-shadow:var(--clay);overflow:hidden}
.shell .lid{
  position:absolute;inset:0;background:linear-gradient(160deg,var(--sea-2),var(--sea));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;
  transition:transform .85s cubic-bezier(.16,1,.3,1);transform-origin:top center;z-index:2;
}
.shell .lid span{font-family:'Jua';font-size:15px}
.shell .lid small{font-size:12px;opacity:.9}
.shell.open .lid{transform:rotateX(-104deg)}
.shell .ridges{position:absolute;inset:0;opacity:.22;
  background:repeating-linear-gradient(100deg,transparent 0 13px,rgba(255,255,255,.7) 13px 15px)}
.answer{background:var(--cream);border-radius:16px;padding:11px 14px;box-shadow:var(--clay-sm)}
.answer b{font-family:'Jua';font-size:12.5px;color:var(--sea)}

/* ─────────────────────────────────────────────
   사진
   ───────────────────────────────────────────── */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.shot{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--clay-sm);background:var(--sand);aspect-ratio:3/4}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .who{position:absolute;left:8px;bottom:8px;background:rgba(255,250,242,.92);
  border-radius:99px;padding:2px 10px;font-size:11.5px;font-family:'Jua'}
.shot.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;box-shadow:var(--clay-in)}
.blurwrap{border-radius:22px;overflow:hidden;box-shadow:var(--clay);background:#000;aspect-ratio:4/3}
.blurwrap img{width:100%;height:100%;object-fit:cover;transition:filter .6s}

/* 오버레이 촬영 */
.cam{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:3/4;box-shadow:var(--clay)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .ghostimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cam .grid{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.28) 33% 33.4%,transparent 33.4% 66.6%,rgba(255,255,255,.28) 66.6% 67%,transparent 67%),
             linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.28) 33% 33.4%,transparent 33.4% 66.6%,rgba(255,255,255,.28) 66.6% 67%,transparent 67%)}

/* ─────────────────────────────────────────────
   퀴즈쇼
   ───────────────────────────────────────────── */
.score{display:flex;gap:12px;margin:14px 0}
.score div{flex:1;background:var(--cream);border-radius:20px;box-shadow:var(--clay);padding:13px;text-align:center}
.score .n{font-family:'Jua';font-size:31px;line-height:1.1}
.score .nm{font-size:12.5px;color:var(--muted)}
.score div.lead{background:linear-gradient(150deg,var(--sea-2),var(--sea));color:#fff}
.score div.lead .nm{color:rgba(255,255,255,.88)}
.rounds{display:flex;gap:7px;margin:12px 0 4px;flex-wrap:wrap}
.rounds button{flex:1;min-width:56px;padding:9px 6px;font-size:12.5px;text-align:center}
.qbox{background:var(--sand);border-radius:22px;padding:19px;box-shadow:var(--clay);margin:14px 0}
.qbox .qn{font-size:12px;color:var(--sea-deep,#3E8F8B);font-family:'Jua'}
.qbox .qt{font-size:18.5px;font-family:'Jua';line-height:1.45;margin:6px 0 14px}
.choice{display:block;width:100%;text-align:left;margin:8px 0}
.choice.ok{background:var(--sea);color:#fff}
.choice.no{background:#F0C4B6}

/* 토스트 & 상태 */
#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;
  background:var(--deep);color:var(--cream);padding:11px 20px;border-radius:99px;font-size:14px;
  transition:.3s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.netbar{position:fixed;top:0;left:0;right:0;background:var(--coral);color:#fff;
  font-size:12.5px;text-align:center;padding:5px;z-index:70;display:none}
.netbar.on{display:block}

/* 하단 바 */
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(234,246,243,.94);
  backdrop-filter:blur(12px);padding:10px 14px calc(9px + env(safe-area-inset-bottom));z-index:50}
.bottom .inner{max-width:520px;margin:0 auto}
nav{display:flex;gap:9px;margin-top:9px}
nav button{flex:1;padding:11px 4px;font-size:13px}

/* 실시간 점수판 */
.live{display:flex;gap:9px;align-items:stretch}
.live .p{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--cream);border-radius:17px;box-shadow:var(--clay-sm);padding:8px 15px}
.live .p .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .p .n{font-family:'Jua';font-size:23px;line-height:1}
.live .p.lead{background:linear-gradient(150deg,var(--sea-2),var(--sea));color:#fff}
.live .vs{align-self:center;font-size:11.5px;color:var(--muted);font-family:'Jua'}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="netbar" id="netbar">오프라인 — 저장해뒀다가 연결되면 자동으로 보냅니다</div>

<div class="wrap">
  <header>
    <div class="eyebrow">2일 · 12개 슬롯 · 둘</div>
    <h1 id="hdr">속초 2일, 우리 둘</h1>
    <div class="tide"><i id="tide" style="width:0%"></i></div>
    <div class="tide-label"><span id="tideL">아직 출발 전</span><span id="tideR">0 / 12</span></div>
  </header>
  <main id="app"></main>
</div>

<div class="bottom"><div class="inner">
  <div class="live" id="live"></div>
  <nav>
    <button onclick="go('home')">일정</button>
    <button onclick="go('slot','show')">퀴즈쇼</button>
    <button onclick="go('album')">앨범</button>
    <button onclick="go('me')">나</button>
  </nav>
</div></div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════
   0. 설정
   ═══════════════════════════════════════════════════ */
const CONFIG = {
  // Apps Script 웹앱 배포 URL. 비워두면 이 기기에만 저장됩니다(패스앤플레이).
  API_URL: '',
  // 개발 중에는 true. 실전 문항 대신 더미 문항이 나옵니다.
  USE_DUMMY: true,
  // 여행 날짜 — 문항 셔플 시드로도 씁니다.
  TRIP_DATE: '2026-08-15',
  // 이름은 앱 첫 화면에서 받습니다. 여기에 미리 적어두면 그 값을 씁니다.
  NAMES: { A:'', B:'' },
  POLL_MS: 4000
};

/* ═══════════════════════════════════════════════════
   1. 일정
   ═══════════════════════════════════════════════════ */
const TRIP = [
  { id:'move',    day:1, time:'08:00', place:'서울 → 고성',   type:'seal',
    desc:'오늘 하루를 미리 봉인합니다', mark:'🔒' },
  { id:'checkin', day:1, time:'10:30', place:'소노캄 체크인',  type:'capture',
    desc:'상대 몰래 방 사진 한 장', mark:'🔑', hint:'커튼 색, 슬리퍼 개수, 창밖 풍경 — 나중에 문제가 됩니다', solo:true },
  { id:'lunch',   day:1, time:'11:30', place:'가보오토종닭',   type:'capture',
    desc:'메뉴판과 영수증', mark:'🍗', hint:'영수증은 총액이 보이게', guess:'오늘 점심 총액' },
  { id:'balhae',  day:1, time:'16:00', place:'발해역사관',     type:'ai',
    desc:'패널 찍으면 문제가 나옵니다', mark:'🏛' },
  { id:'brew',    day:1, time:'18:00', place:'크래프트루트',   type:'brew',
    desc:'탭리스트 · 이름 짓기 · 테이스팅', mark:'🍺' },
  { id:'show',    day:1, time:'19:30', place:'숙소 퀴즈쇼',    type:'show',
    desc:'오늘 모은 걸 전부 개봉', mark:'🏆' },
  { id:'m2', day:2, time:'12:00', place:'바다정원',   type:'mission', mode:'theme', theme:'따뜻한 것',
    desc:'같은 주제 「따뜻한 것」', mark:'☕' },
  { id:'m3', day:2, time:'14:00', place:'바다',       type:'mission', mode:'theme', theme:'이 여행을 한 단어로',
    desc:'같은 주제 「이 여행을 한 단어로」', mark:'🌊' },
  { id:'m4', day:2, time:'15:00', place:'모녀가리비', type:'mission', mode:'overlay',
    desc:'같은 구도 · 상대 사진 겹쳐 찍기', mark:'🐚' },
  { id:'end', day:2, time:'16:30', place:'귀가길',    type:'finale',
    desc:'시상식', mark:'🎬' }
];
const SLOT = id => TRIP.find(s=>s.id===id);

/* 봉인 문항 — 정답이 아직 세상에 없으므로 미리 봐도 안전 */
const SEALS = [
  { id:'s1', q:'오늘 총 지출, 얼마 나올까?',      unit:'원' },
  { id:'s2', q:'소노캄에 실제로 몇 시에 도착할까?', unit:'' },
  { id:'s3', q:'오늘 상대가 제일 많이 할 말은?',   unit:'' }
];
/* ═══════════════════════════════════════════════════
   2. 저장소 — localStorage 있으면 쓰고, 없으면 메모리
   ═══════════════════════════════════════════════════ */
const mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v??mem[k]??null; }catch(e){ return mem[k]??null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};

/* 기본 상태 */
const blank = () => ({
  names:{ A:'', B:'' },
  seals:{}, photos:[], customQ:[], aiQ:[], guesses:{},
  beers:{ names:{}, verdict:null },
  show:{ i:0, scores:{A:0,B:0}, ans:{}, truth:{}, graded:{} },
  finale:{ best:{}, titles:{}, orderScore:null },
  rev:0
});
let S = blank();
let me = store.get('me') || null;

function load(){ try{ const raw=store.get('state'); if(raw) S=Object.assign(blank(),JSON.parse(raw)); }catch(e){} }
function save(){ store.set('state', JSON.stringify(S)); push(); }
load();

/* ═══════════════════════════════════════════════════
   3. 통신 — Apps Script (preflight 피하려고 text/plain)
   ═══════════════════════════════════════════════════ */
let online = navigator.onLine, pushing=false, dirty=false;
addEventListener('online', ()=>{ online=true; document.getElementById('netbar').classList.remove('on'); flush(); });
addEventListener('offline',()=>{ online=false; document.getElementById('netbar').classList.add('on'); });

async function call(action, payload){
  if(!CONFIG.API_URL) throw new Error('local');
  const r = await fetch(CONFIG.API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, payload })
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'서버 오류');
  return j.data;
}

async function push(){
  if(!CONFIG.API_URL){ return; }
  if(!online){ dirty=true; return; }
  if(pushing){ dirty=true; return; }
  pushing=true;
  try{
    S.rev = Date.now();
    await call('setState', { state:S });
    dirty=false;
  }catch(e){ dirty=true; }
  finally{ pushing=false; }
}
function flush(){ if(dirty) push(); }

async function pull(){
  if(!CONFIG.API_URL || !online) return;
  try{
    const remote = await call('getState', {});
    if(remote && remote.rev > (S.rev||0)){
      S = Object.assign(blank(), remote);
      store.set('state', JSON.stringify(S));
      render();
    }
  }catch(e){}
}
setInterval(pull, CONFIG.POLL_MS);

/* ═══════════════════════════════════════════════════
   4. 사진 — 리사이즈 후 업로드, 실패하면 큐에 보관
   ═══════════════════════════════════════════════════ */
function shrink(file, max=1200, q=.8){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('이미지가 아닙니다'));
      img.onload=()=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function addPhoto(dataUrl, meta){
  const p = Object.assign({
    id:'p'+Date.now()+Math.random().toString(36).slice(2,6),
    by:me, ts:Date.now(), local:dataUrl, url:null
  }, meta);
  S.photos.push(p); save(); render();
  try{
    const up = await call('upload', { id:p.id, dataUrl, slot:p.slot });
    p.url = up.url; delete p.local; save();
  }catch(e){ /* 로컬에 남아 있다가 다음 push 때 다시 시도 */ }
  return p;
}
const src = p => p.url || p.local || '';
const photosOf = (slot, opt={}) => S.photos.filter(p =>
  p.slot===slot && (!opt.mission || p.mission===opt.mission) && (!opt.by || p.by===opt.by));

async function pick(meta, cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.capture='environment';
  i.onchange=async()=>{
    if(!i.files[0]) return;
    toast('줄이는 중…');
    try{
      const d=await shrink(i.files[0]);
      const p=await addPhoto(d, meta);
      toast('올렸습니다'); cb&&cb(p);
    }catch(e){ toast(e.message); }
  };
  i.click();
}

/* ═══════════════════════════════════════════════════
   5. 날짜 시드 셔플 — 미리 순서를 확인할 수 없게
   ═══════════════════════════════════════════════════ */
function mulberry32(a){ return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
};}
function seedOf(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function shuffle(arr, seedStr){
  const rnd=mulberry32(seedOf(seedStr)), a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const DUMMY_Q = [
  { q:'1 + 1 은?', choices:['1','2','3','4'], answer:1 },
  { q:'속초는 어느 도에 있을까?', choices:['강원','경기','충북','전남'], answer:0 },
  { q:'테스트 문항입니다. 두 번째를 고르세요.', choices:['가','나','다','라'], answer:1 }
];

/* ═══════════════════════════════════════════════════
   6. 화면
   ═══════════════════════════════════════════════════ */
let view={name:'home',arg:null};
function go(name,arg){ view={name,arg}; scrollTo({top:0,behavior:'smooth'}); render(); }
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2200); }
const other = () => me==='A'?'B':'A';
const nameOf = k => (S.names&&S.names[k]) || CONFIG.NAMES[k] || (k==='A'?'왼쪽':'오른쪽');
const named = () => !!((S.names.A||CONFIG.NAMES.A) && (S.names.B||CONFIG.NAMES.B));

/* 슬롯 완료 판정 */
function isDone(s){
  switch(s.type){
    case 'seal':    return SEALS.every(x=>S.seals[x.id]&&S.seals[x.id][me]!=null);
    case 'capture': return photosOf(s.id,{by:me}).length>0;
    case 'ai':      return S.aiQ.length>0;
    case 'brew':    return !!S.beers.names[me];
    case 'show':    return queue().length>0 && S.show.i>=queue().length;
    case 'mission': return photosOf(s.id,{by:me}).length>0;
    case 'finale':  return !!S.finale.best[me];
  }
  return false;
}

function render(){
  if(!me) return screenWho();
  const el=document.getElementById('app');
  const n=TRIP.filter(isDone).length;
  document.getElementById('tide').style.width=(n/TRIP.length*100)+'%';
  document.getElementById('tideR').textContent=n+' / '+TRIP.length;
  document.getElementById('tideL').textContent = n===0?'아직 출발 전' : n===TRIP.length?'다 채웠습니다' : (TRIP.filter(s=>!isDone(s))[0].place+' 차례');
  const sc=S.show.scores, tot=queue().length, at=Math.min(S.show.i,tot);
  document.getElementById('live').innerHTML=`
    <div class="p ${sc.A>sc.B?'lead':''}"><span class="nm">${esc(nameOf('A'))}</span><span class="n">${sc.A}</span></div>
    <span class="vs">${tot? at+'/'+tot : 'vs'}</span>
    <div class="p ${sc.B>sc.A?'lead':''}"><span class="n">${sc.B}</span><span class="nm">${esc(nameOf('B'))}</span></div>`;
  const fn={home:screenHome,slot:screenSlot,album:screenAlbum,me:screenMe}[view.name]||screenHome;
  el.innerHTML=fn();
  el.querySelectorAll('[data-run]').forEach(x=>x.addEventListener('click',()=>window[x.dataset.run](x.dataset.a,x.dataset.b)));
  if(view.name==='slot'&&SLOT(view.arg)?.mode==='overlay') setTimeout(startCam,60);
}

/* ── 누구세요 ────────────────────────────────── */
function screenWho(){
  const el=document.getElementById('app');
  if(!named()){
    el.innerHTML=`
    <div class="card">
      <h2 style="margin-top:0">둘의 이름을 적어주세요</h2>
      <p class="muted">한 번만 하면 됩니다. 다른 폰에도 그대로 넘어가요.</p>
      <label>첫 번째 사람</label>
      <input id="nA" placeholder="이름" value="${esc(S.names.A)}">
      <label>두 번째 사람</label>
      <input id="nB" placeholder="이름" value="${esc(S.names.B)}">
      <button class="primary wide" style="margin-top:16px" id="okName">다음</button>
    </div>`;
    el.querySelector('#okName').addEventListener('click',()=>{
      const a=el.querySelector('#nA').value.trim(), b=el.querySelector('#nB').value.trim();
      if(!a||!b) return toast('두 사람 다 적어주세요');
      if(a===b)  return toast('이름이 같으면 구분이 안 됩니다');
      S.names={A:a,B:b}; save(); render();
    });
    return;
  }
  el.innerHTML=`
  <div class="card center">
    <h2 style="margin-top:0">이 폰은 누구 폰인가요?</h2>
    <p class="muted">각자 자기 이름을 누르세요. 폰마다 한 번씩입니다.</p>
    <div class="row" style="margin-top:16px">
      <button class="primary" data-k="A">${esc(nameOf('A'))}</button>
      <button class="primary" data-k="B">${esc(nameOf('B'))}</button>
    </div>
    <button style="margin-top:14px" id="reName">이름 다시 적기</button>
  </div>`;
  el.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('click',()=>setMe(x.dataset.k)));
  el.querySelector('#reName').addEventListener('click',()=>{ S.names={A:'',B:''}; save(); render(); });
}
function setMe(k){ me=k; store.set('me',k); render(); }

/* ── 일정 ────────────────────────────────────── */
function screenHome(){
  let h='';
  [1,2].forEach(d=>{
    h+=`<div class="day-head"><h2>${d}일차</h2><hr>
        <span class="pill sand">${d===1?'퀴즈쇼':'추억 남기기'}</span></div>`;
    TRIP.filter(s=>s.day===d).forEach(s=>{
      const done=isDone(s);
      h+=`<button class="slot ${done?'done':''}" data-run="go" data-a="slot" data-b="${s.id}">
        <span class="t">${s.time}</span>
        <span class="body"><span class="place">${s.mark} ${esc(s.place)}</span>
        <span class="desc">${esc(s.desc)}</span></span>
        <span class="mark">${done?'✓':'›'}</span></button>`;
    });
  });
  return h;
}

/* ── 슬롯 라우팅 ─────────────────────────────── */
function screenSlot(){
  const s=SLOT(view.arg); if(!s) return screenHome();
  const head=`<div class="card tight">
    <span class="pill">${s.day}일차 ${s.time}</span>
    <h2 style="margin:9px 0 2px">${s.mark} ${esc(s.place)}</h2>
    <p class="muted" style="margin:0">${esc(s.desc)}</p></div>`;
  const body={ seal:vSeal, capture:vCapture, ai:vAI,
               brew:vBrew, show:vShow, mission:vMission, finale:vFinale }[s.type](s);
  return head+body;
}

/* ── 봉인 ────────────────────────────────────── */
function vSeal(){
  let h=`<p class="muted">둘 다 제출해야 열립니다. 개봉은 밤 퀴즈쇼 5라운드에서.</p>`;
  SEALS.forEach(x=>{
    const rec=S.seals[x.id]||{};

function sealIn(id){

}

/* ── 사진 수집 ───────────────────────────────── */
function vCapture(s){
  const mine=photosOf(s.id,{by:me});
  let h=`<div class="card">
    ${s.hint?`<p class="muted" style="margin-top:0">${esc(s.hint)}</p>`:''}
    <button class="primary wide" data-run="capShot" data-a="${s.id}">📷 사진 추가</button>
    ${s.solo?`<p class="muted center" style="margin-bottom:0">상대에게 안 보입니다. 퀴즈쇼에서만 열려요.</p>`:''}
    <div class="shots" style="margin-top:14px">
      ${mine.map(p=>`<div class="shot"><img src="${src(p)}" alt=""><span class="who">${esc(nameOf(p.by))}</span></div>`).join('')
        || `<div class="shot empty">아직 없음</div><div class="shot empty"></div>`}
    </div></div>`;
  if(s.guess){
    const g=S.guesses[s.id]||{};
    h+=`<div class="card"><div class="jua" style="margin-bottom:8px">${esc(s.guess)} — 근접값 대결</div>`;
    h+= g[me]!=null
      ? `<p class="muted" style="margin:0">내 답 <b>${esc(g[me])}</b> · ${g[other()]!=null?'둘 다 냈습니다':nameOf(other())+' 기다리는 중'}</p>
         <label>실제 금액 (영수증 보고)</label>
         <div class="row"><input id="real_${s.id}" value="${esc(g.real??'')}" placeholder="숫자만">
         <button style="flex:0 0 72px" data-run="setReal" data-a="${s.id}">저장</button></div>`
      : `<div class="row"><input id="g_${s.id}" placeholder="숫자만">
         <button class="primary" style="flex:0 0 84px" data-run="guessIn" data-a="${s.id}">제출</button></div>`;
    h+=`</div>`;
  }
  h+=`<div class="card"><div class="jua" style="margin-bottom:4px">여기서 낼 문제</div>
      <p class="muted" style="margin-top:0">상대가 밤에 풉니다. 정답도 같이 넣어주세요.</p>
      <input id="cq" placeholder="예) 방 슬리퍼 몇 켤레였게?">
      <input id="ca" placeholder="정답" style="margin-top:9px">
      <button class="primary wide" style="margin-top:11px" data-run="addQ" data-a="${s.id}">문제 만들기</button>
      <p class="muted" style="margin-bottom:0">내가 낸 문제 ${S.customQ.filter(q=>q.slot===s.id&&q.by===me).length}개</p></div>`;
  return h;
}
function capShot(slot){ pick({slot}); }
function guessIn(slot){
  const v=document.getElementById('g_'+slot).value.trim();
  if(!v) return toast('숫자를 넣어주세요');
  S.guesses[slot]=S.guesses[slot]||{}; S.guesses[slot][me]=v; save(); render();
}
function setReal(slot){
  S.guesses[slot].real=document.getElementById('real_'+slot).value.trim(); save(); toast('저장했습니다');
}
function addQ(slot){
  const q=document.getElementById('cq').value.trim(), a=document.getElementById('ca').value.trim();
  if(!q||!a) return toast('문제와 정답 둘 다 필요합니다');
  S.customQ.push({id:'c'+Date.now(),slot,by:me,q,a}); save(); render(); toast('문제 추가');
}

/* ── 발해역사관: 패널 → AI 문항 ──────────────── */
function vAI(s){
  const panels=photosOf(s.id);
  return `<div class="card">
    <p class="muted" style="margin-top:0">설명 패널을 찍으면 그 내용으로 문제가 만들어집니다.

    <button class="primary wide" data-run="capShot" data-a="${s.id}">📷 패널 찍기</button>
    <div class="shots" style="margin-top:14px">
      ${panels.map(p=>`<div class="shot"><img src="${src(p)}" alt=""><span class="who">${esc(nameOf(p.by))}</span></div>`).join('')
        || `<div class="shot empty">패널 사진 없음</div><div class="shot empty"></div>`}
    </div>
    <button class="coral wide" style="margin-top:14px" ${panels.length?'':'disabled'} data-run="genQuiz">

    <p class="muted center" style="margin-bottom:0">
      ${S.aiQ.length? S.aiQ.length+'문제 준비됨 — 내용은 밤에 열립니다' : '아직 없음'}</p>
  </div>
  <div class="card"><div class="jua" style="margin-bottom:4px">각자 몰래 3문제</div>
    <p class="muted" style="margin-top:0">전시 보다가 눈에 띄는 걸로.</p>
    <input id="cq" placeholder="문제">
    <input id="ca" placeholder="정답" style="margin-top:9px">

    <p class="muted" style="margin-bottom:0">내가 낸 문제 ${S.customQ.filter(q=>q.slot===s.id&&q.by===me).length} / 3</p>

}
async function genQuiz(){
  const panels=photosOf('balhae');
  if(!panels.length) return toast('패널 사진이 먼저입니다');
  if(CONFIG.USE_DUMMY){
    S.aiQ=shuffle(DUMMY_Q,CONFIG.TRIP_DATE).slice(0,3); save(); render();
    return toast('더미 문항 3개 (개발용)');
  }
  toast('만드는 중… 20초쯤 걸립니다');
  try{
    const imgs=panels.slice(0,4).map(p=>p.url||p.local);
    const out=await call('genQuiz',{ images:imgs, count:8, seed:CONFIG.TRIP_DATE });
    S.aiQ=shuffle(out.questions,CONFIG.TRIP_DATE).slice(0,6);
    save(); render(); toast(S.aiQ.length+'문제 준비 완료');
  }catch(e){ toast('실패: '+e.message); }
}

/* ── 양조장 ──────────────────────────────────── */
function vBrew(s){
  return `<div class="card"><div class="jua" style="margin-bottom:4px">신메뉴 이름 짓기</div>
    <p class="muted" style="margin-top:0">속초 지명으로 하나. 밤에 블라인드로 판정합니다.</p>
    ${S.beers.names[me]
      ? `<div class="shell ${S.beers.names.A&&S.beers.names.B?'open':''}"><div class="ridges"></div>
         <div class="lid"><span>🍺 제출됨</span><small>${S.beers.names.A&&S.beers.names.B?'':'상대 기다리는 중'}</small></div>
         <div class="stack">
           <div class="answer"><b>${esc(nameOf('A'))}</b><div>${esc(S.beers.names.A??'—')}</div></div>
           <div class="answer"><b>${esc(nameOf('B'))}</b><div>${esc(S.beers.names.B??'—')}</div></div>
         </div></div>`

function beerName(){
  const v=document.getElementById('bn').value.trim();

}

/* ── 퀴즈쇼 — 한 문제씩 ──────────────────────── */
/* 문제 한 줄로 세우기. 순서는 낮에 모은 순서 그대로. */
function queue(){
  const out=[];
  S.customQ.forEach(q=>out.push({
    id:q.id, kind:'free', text:q.q, truth:q.a, by:q.by, from:SLOT(q.slot).place }));
  S.aiQ.forEach((q,i)=>out.push({
    id:'ai'+i, kind:'choice', text:q.q, choices:q.choices, truth:q.answer, from:'발해역사관' }));
  const pool=S.photos.filter(p=>['checkin','lunch','balhae','brew'].includes(p.slot));
  shuffle(pool,CONFIG.TRIP_DATE+'blur').slice(0,2).forEach((p,i)=>out.push({
    id:'ph'+i, kind:'photo', text:'이 사진, 어디서 찍었게?', photo:p,
    truth:SLOT(p.slot).place, from:'가려진 사진' }));
  if(S.beers.names.A&&S.beers.names.B) out.push({ id:'beer', kind:'beer', from:'양조장' });
  SEALS.forEach(x=>out.push({ id:'sl_'+x.id, kind:'seal', text:x.q, from:'아침 봉인' }));
  return out;
}
/* 이 문제에 답해야 하는 사람 */
function askers(q){
  if(q.kind==='free'||q.kind==='photo') return q.by? [other2(q.by)] : ['A','B'];
  if(q.kind==='choice') return ['A','B'];
  return [];                                    // 맥주·봉인은 답이 이미 있음
}
const other2 = k => k==='A'?'B':'A';
const ansOf  = qid => S.show.ans[qid]||{};

function vShow(){
  const Q=queue();
  if(!Q.length) return `<div class="card center"><p class="muted" style="margin:0">
    아직 문제가 없습니다. 낮에 사진 찍고 문제를 만들어 두세요.</p></div>`;
  if(S.show.i>=Q.length) return vShowEnd(Q);

  const q=Q[S.show.i], need=askers(q), a=ansOf(q.id);
  const allIn = need.every(k=>a[k]!=null);
  const graded = S.show.graded[q.id];
  let h=`<div class="card tight" style="display:flex;justify-content:space-between;align-items:center">
    <span class="pill sand">${S.show.i+1} / ${Q.length}</span>
    <span class="muted" style="font-size:12.5px">${esc(q.from)}</span></div>`;

  /* ── 맥주 이름 심사 ── */
  if(q.kind==='beer'){
    const n=S.beers.names, v=S.beers.verdict;
    h+=`<div class="qbox"><div class="qt">어느 쪽이 더 그럴듯한 맥주 이름일까</div>
      <div class="stack">
        <div class="answer"><b>1번</b><div>${esc(n.A)}</div></div>
        <div class="answer"><b>2번</b><div>${esc(n.B)}</div></div>
      </div>`;
    h+= v
      ? `<div class="answer" style="margin-top:12px"><b>${esc(nameOf(v.order[v.winner]))} 승</b>
         <div>${esc(v.why)}</div></div>`
      : `<button class="coral wide" style="margin-top:14px" data-run="judgeNames">
         ⚖️ AI 심사 받기 ${CONFIG.USE_DUMMY?'(더미)':''}</button>`;
    h+=`</div>`;
    return h + (v? nextBtn() : '');
  }

  /* ── 봉인 개봉 ── */
  if(q.kind==='seal'){
    const rec=S.seals[q.id.slice(3)]||{};
    h+=`<div class="qbox"><div class="qt">${esc(q.text)}</div>
      <div class="stack">
        <div class="answer"><b>${esc(nameOf('A'))}</b><div>${esc(rec.A??'—')}</div></div>
        <div class="answer"><b>${esc(nameOf('B'))}</b><div>${esc(rec.B??'—')}</div></div>
      </div>
      <label>실제로는?</label>
      <div class="row"><input id="tr" value="${esc(S.show.truth[q.id]??'')}" placeholder="결과 입력">
      <button style="flex:0 0 72px" data-run="setTruth" data-a="${q.id}">확인</button></div>`;
    if(S.show.truth[q.id]) h+=`<div class="answer" style="margin-top:12px"><b>정답</b>
      <div>${esc(S.show.truth[q.id])}</div></div>`+gradeRow(q);
    h+=`</div>`;
    return h + (graded? nextBtn() : '');
  }

  /* ── 나머지: 둘 다 입력 → 정답 확인 → 채점 ── */
  h+=`<div class="qbox">`;
  if(q.photo) h+=`<div class="blurwrap" style="margin-bottom:14px">
    <img src="${src(q.photo)}" style="filter:blur(${allIn?0:22}px)" alt=""></div>`;
  h+=`<div class="qt">${esc(q.text)}</div>`;

  if(q.kind==='choice'){
    const my=a[me];
    q.choices.forEach((c,j)=>{
      const cls = allIn ? (j===q.truth?'ok':(my===j?'no':'')) : (my===j?'sel':'');
      h+=`<button class="choice ${cls}" ${allIn?'disabled':''}
           data-run="answer" data-a="${q.id}" data-b="${j}">${'①②③④'[j]||''} ${esc(c)}</button>`;
    });
  } else if(need.includes(me) && a[me]==null){
    h+=`<div class="row"><input id="ai_${q.id}" placeholder="내 답">
        <button class="primary" style="flex:0 0 72px" data-run="answer" data-a="${q.id}">제출</button></div>`;
  }

  if(!allIn){
    const wait=need.filter(k=>a[k]==null);
    h+=`<p class="muted center" style="margin-bottom:0">
      ${need.includes(me)&&a[me]==null? '답을 넣어주세요' : nameOf(wait[0])+' 기다리는 중'}</p>`;
  }else{
    if(q.kind!=='choice'){
      h+=`<div class="stack" style="margin-top:12px">
        ${need.map(k=>`<div class="answer"><b>${esc(nameOf(k))}</b><div>${esc(a[k])}</div></div>`).join('')}
        <div class="answer" style="background:var(--sea-2)"><b>정답</b><div>${esc(q.truth)}</div></div>
      </div>`;
    }
    h+=gradeRow(q);
  }
  h+=`</div>`;
  return h + (graded? nextBtn() : '');
}

/* 4지선다는 자동 채점되므로 결과만 보여줍니다 */
function gradeRow(q){
  const g=S.show.graded[q.id];
  if(g) return `<p class="center jua" style="font-size:17px;margin:14px 0 0">
    ${g==='none'?'둘 다 못 맞혔습니다':g==='both'?'둘 다 정답 🎉':esc(nameOf(g))+' 정답 +1'}</p>`;
  if(q.kind==='choice'){
    const a=ansOf(q.id);
    const auto = a.A===q.truth && a.B===q.truth ? 'both'
               : a.A===q.truth ? 'A' : a.B===q.truth ? 'B' : 'none';
    setTimeout(()=>grade(q.id,auto),0);
    return '';
  }
  return `<p class="muted center" style="margin:14px 0 6px">누가 맞혔나요?</p>
    <div class="row">
      <button class="primary" data-run="grade" data-a="${q.id}" data-b="A">${esc(nameOf('A'))}</button>
      <button class="primary" data-run="grade" data-a="${q.id}" data-b="B">${esc(nameOf('B'))}</button>
    </div>
    <div class="row" style="margin-top:9px">
      <button data-run="grade" data-a="${q.id}" data-b="both">둘 다</button>
      <button data-run="grade" data-a="${q.id}" data-b="none">아무도</button>
    </div>`;
}
const nextBtn = () => `<button class="primary wide" data-run="nextQ">다음 문제 →</button>`;

function answer(qid,choice){
  const v = choice!=null ? Number(choice) : document.getElementById('ai_'+qid).value.trim();
  if(v==='') return toast('답을 넣어주세요');
  S.show.ans[qid]=S.show.ans[qid]||{}; S.show.ans[qid][me]=v; save(); render();
}
function grade(qid,who){
  if(S.show.graded[qid]) return;
  S.show.graded[qid]=who;
  if(who==='both'){ S.show.scores.A++; S.show.scores.B++; }
  else if(who==='A'||who==='B') S.show.scores[who]++;
  save(); render();
}
function setTruth(qid){
  const v=document.getElementById('tr').value.trim();
  if(!v) return toast('결과를 넣어주세요');
  S.show.truth[qid]=v; save(); render();
}
function nextQ(){ S.show.i++; save(); render(); }
function prevQ(){ if(S.show.i>0){ S.show.i--; save(); render(); } }

function vShowEnd(Q){
  const sc=S.show.scores;
  return `<div class="card center">
    <div class="jua" style="font-size:23px">${sc.A===sc.B?'무승부':esc(nameOf(sc.A>sc.B?'A':'B'))+' 우승 🏆'}</div>
    <p class="muted">${Q.length}문제 · ${sc.A} 대 ${sc.B}</p>
    <p class="muted">우승자가 내일 메뉴를 정합니다.</p>
    <button class="wide" style="margin-top:8px" data-run="prevQ">마지막 문제 다시 보기</button>
    <button class="wide" style="margin-top:9px" data-run="resetShow">처음부터 다시</button>
  </div>`;
}
function resetShow(){
  if(!confirm('점수와 답을 모두 지우고 처음부터 다시 할까요?')) return;
  S.show={ i:0, scores:{A:0,B:0}, ans:{}, truth:{}, graded:{} };
  S.beers.verdict=null; save(); render();
}
async function judgeNames(){
  const n=S.beers.names;
  const order=shuffle(['A','B'],CONFIG.TRIP_DATE+'judge');
  const done=(v)=>{ S.beers.verdict=v; grade('beer',v.order[v.winner]); };
  if(CONFIG.USE_DUMMY){
    done({order,winner:0,why:'더미 심사입니다. 실전에서는 AI가 이유를 씁니다.'});
    return toast('더미 판정 (개발용)');
  }
  toast('심사 중…');
  try{
    const out=await call('judgeNames',{ names:[n[order[0]],n[order[1]]] });
    done({order,winner:out.winner,why:out.why});
    toast('판정이 나왔습니다');
  }catch(e){ toast('실패: '+e.message); }
}

/* ── 2일차 사진 미션 ─────────────────────────── */
function vMission(s){
  const mine=photosOf(s.id,{by:me})[0], yours=photosOf(s.id,{by:other()})[0];
  const both=mine&&yours;
  const intro={
    theme:`주제 하나, 각자 5분, 한 장씩. 정답은 없습니다.`,
    overlay:`상대 사진을 화면에 겹쳐 두고 맞춰서 찍습니다.`
  }[s.mode];
  let h=`<div class="card"><p class="muted" style="margin-top:0">${intro}</p>`;
  if(s.theme) h+=`<div class="center" style="margin:14px 0">
    <span class="pill coral" style="font-size:16px;padding:8px 20px;font-family:Jua">${esc(s.theme)}</span></div>`;

  if(s.mode==='overlay'){
    h+= yours
      ? `<div class="cam"><video id="v" playsinline muted></video>
         <img class="ghostimg" src="${src(yours)}" style="opacity:${peek.op ?? 0.3}" alt="">
         <div class="grid"></div></div>
         <label>겹친 사진 진하기</label>
         <input type="range" min="10" max="70" value="${(peek.op ?? 0.3)*100}" oninput="peek.op=this.value/100;document.querySelector('.ghostimg').style.opacity=peek.op">
         <button class="primary wide" style="margin-top:11px" data-run="snap" data-a="${s.id}">📸 지금 찍기</button>
         <button class="wide" style="margin-top:9px" data-run="capShot" data-a="${s.id}">앨범에서 고르기</button>`
      : `<p class="muted">${esc(nameOf(other()))}가 먼저 찍어야 겹칠 사진이 생깁니다.</p>
         <button class="primary wide" data-run="capShot" data-a="${s.id}">📷 내가 먼저 찍기</button>`;
  }else{
    h+=`<button class="primary wide" data-run="capShot" data-a="${s.id}">📷 내 사진 올리기</button>`;
  }
  h+=`<div class="shots" style="margin-top:16px">
    <div class="shot ${mine?'':'empty'}">${mine?`<img src="${src(mine)}" alt=""><span class="who">${esc(nameOf(me))}</span>`:'내 사진'}</div>
    <div class="shot ${both?'':'empty'}">${both?`<img src="${src(yours)}" alt=""><span class="who">${esc(nameOf(other()))}</span>`
      : (yours? '🔒 내가 올리면 열림' : '상대 대기 중')}</div>
  </div></div>`;
  return h;
}
let camStream=null;
async function startCam(){
  const v=document.getElementById('v'); if(!v) return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    v.srcObject=camStream; await v.play();
  }catch(e){ toast('카메라를 열 수 없습니다 — 앨범에서 고르세요'); }
}
async function snap(slot){
  const v=document.getElementById('v'); if(!v||!v.videoWidth) return toast('카메라 준비 중입니다');
  const c=document.createElement('canvas');
  const sc=Math.min(1,1200/Math.max(v.videoWidth,v.videoHeight));
  c.width=v.videoWidth*sc; c.height=v.videoHeight*sc;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  await addPhoto(c.toDataURL('image/jpeg',.8),{slot});
  camStream&&camStream.getTracks().forEach(t=>t.stop());
  toast('찍었습니다');
}

/* ── 결산 ────────────────────────────────────── */
function vFinale(){
  const yours=S.photos.filter(p=>p.by===other());
  const picked=S.finale.best[me];
  const pool=shuffle(S.photos.slice(),CONFIG.TRIP_DATE+'order').slice(0,8);
  const sc=S.show.scores;
  let h=`<div class="card"><div class="jua" style="margin-bottom:8px">최종 점수</div>
    <div class="score" style="margin:0">
      <div class="${sc.A>=sc.B?'lead':''}"><div class="n">${sc.A}</div><div class="nm">${esc(nameOf('A'))}</div></div>
      <div class="${sc.B>=sc.A?'lead':''}"><div class="n">${sc.B}</div><div class="nm">${esc(nameOf('B'))}</div></div>
    </div></div>`;

  h+=`<div class="card"><div class="jua" style="margin-bottom:4px">${esc(nameOf(other()))}의 사진 중 베스트</div>
    <p class="muted" style="margin-top:0">한 장 고르고, 제목을 붙여주세요.</p>
    <div class="shots">${yours.length? yours.map(p=>
      `<div class="shot" style="${picked===p.id?'outline:4px solid var(--coral);outline-offset:-4px':''}">
        <img src="${src(p)}" alt="" data-run="pickBest" data-a="${p.id}"></div>`).join('')
      : `<div class="shot empty">상대 사진이 없습니다</div><div class="shot empty"></div>`}</div>`;
  if(picked) h+=`<label>제목 붙이기</label>
    <div class="row"><input id="ttl" value="${esc(S.finale.titles[picked]??'')}" placeholder="예) 파도보다 먼저 웃은 사람">
    <button class="primary" style="flex:0 0 72px" data-run="setTitle">저장</button></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="jua" style="margin-bottom:4px">시간순 맞히기</div>
    <p class="muted" style="margin-top:0">찍은 순서대로 눌러주세요. 촬영 시각은 앱이 알고 있습니다.</p>
    <div class="shots">${pool.map((p,i)=>{
      const n=(peek.order||[]).indexOf(p.id);
      return `<div class="shot" style="${n>=0?'outline:4px solid var(--sea);outline-offset:-4px':''}">
        <img src="${src(p)}" alt="" data-run="tapOrder" data-a="${p.id}">
        ${n>=0?`<span class="who">${n+1}</span>`:''}</div>`;}).join('')}</div>
    <div class="row" style="margin-top:12px">
      <button data-run="resetOrder">다시</button>
      <button class="primary" data-run="gradeOrder">채점</button></div>
    ${S.finale.orderScore!=null?`<p class="center jua" style="font-size:19px;margin-bottom:0">
      ${pool.length}장 중 ${S.finale.orderScore}장 정확</p>`:''}
  </div>`;

  h+=`<div class="card center"><div class="jua" style="font-size:19px">
    ${sc.A===sc.B?'무승부입니다':esc(nameOf(sc.A>sc.B?'A':'B'))+' 우승 🏆'}</div>
    <p class="muted" style="margin-bottom:0">사진 ${S.photos.length}장 · 문제 ${S.customQ.length+S.aiQ.length}개 · 봉인 ${SEALS.length}건</p></div>`;
  return h;
}
function pickBest(id){ S.finale.best[me]=id; save(); render(); }
function setTitle(){
  const id=S.finale.best[me];
  S.finale.titles[id]=document.getElementById('ttl').value.trim(); save(); toast('제목을 저장했습니다');
}
function tapOrder(id){
  peek.order=peek.order||[];
  const i=peek.order.indexOf(id);
  i>=0? peek.order.splice(i,1) : peek.order.push(id);
  render();
}
function resetOrder(){ peek.order=[]; S.finale.orderScore=null; save(); render(); }
function gradeOrder(){
  const chosen=(peek.order||[]).map(id=>S.photos.find(p=>p.id===id)).filter(Boolean);
  if(chosen.length<2) return toast('두 장 이상 골라주세요');
  const truth=chosen.slice().sort((a,b)=>a.ts-b.ts);
  S.finale.orderScore=chosen.filter((p,i)=>truth[i].id===p.id).length;
  save(); render();
}

/* ── 앨범 / 나 ───────────────────────────────── */
function screenAlbum(){
  if(!S.photos.length) return `<div class="card center"><p class="muted" style="margin:0">
    아직 한 장도 없습니다. 슬롯에서 찍어보세요.</p></div>`;
  let h='';
  TRIP.forEach(s=>{
    const ps=photosOf(s.id); if(!ps.length) return;
    h+=`<div class="card"><span class="pill sand">${s.day}일차 ${s.time}</span>
      <div class="jua" style="margin:8px 0 12px">${s.mark} ${esc(s.place)}</div>
      <div class="shots">${ps.map(p=>{
        const t=S.finale.titles[p.id];
        return `<div class="shot"><img src="${src(p)}" alt="">
          <span class="who">${t?esc(t):esc(nameOf(p.by))}</span></div>`;}).join('')}</div></div>`;
  });
  return h;
}
function screenMe(){
  const n=S.photos.filter(p=>p.by===me).length;
  return `<div class="card">
    <div class="jua" style="font-size:19px">${esc(nameOf(me))}</div>
    <p class="muted">내 사진 ${n}장 · 내가 낸 문제 ${S.customQ.filter(q=>q.by===me).length}개</p>
    <p class="muted">${CONFIG.API_URL? (online?'서버 연결됨':'오프라인 — 임시 저장 중') : '서버 없음 — 이 기기에만 저장됩니다'}
      ${CONFIG.USE_DUMMY?' · 더미 모드':''}</p>
    <button class="wide" data-run="swapMe">다른 사람으로 바꾸기</button>
    <button class="wide" style="margin-top:9px" data-run="reName">이름 고치기</button>
    <button class="wide" style="margin-top:9px" data-run="wipe">전부 지우기</button>
  </div>`;
}
function reName(){ S.names={A:'',B:''}; me=null; store.set('me',''); save(); render(); }
function swapMe(){ me=other(); store.set('me',me); render(); }
function wipe(){ if(confirm('사진과 점수까지 전부 지웁니다. 계속할까요?')){ S=blank(); save(); go('home'); } }

/* 시작 */
render(); pull();
</script>
</body>
