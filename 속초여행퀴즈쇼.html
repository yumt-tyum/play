<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEDC">
<title>속초 2일, 우리 둘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   천 조각 · 자수 · 조각보
   ═══════════════════════════════════════════════ */
:root{
  --paper:#FBF3E2;      /* 무명천 */
  --paper-2:#F2E6CC;
  --red:#C94A42;        /* 빨강 실 */
  --red-2:#E68B7E;
  --green:#6B9A52;      /* 초록 실 */
  --green-2:#A9C68A;
  --denim:#5A7CA3;      /* 데님 */
  --denim-d:#456B8E;
  --mustard:#E0A93A;
  --pink:#E4989E;
  --plum:#8878B0;
  --sky:#8CBBD4;
  --ink:#4A3B32;        /* 갈색 잉크 */
  --muted:#8A7663;
  --stitch:#C9A98A;     /* 실 색 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font-family:'Gowun Dodum',system-ui,sans-serif;
  font-size:16px;line-height:1.68;
  padding:0 0 152px;
  overscroll-behavior-y:contain;
  /* 수채 체크 바탕 */
  background-color:#F4EEDD;
  background-image:
    repeating-linear-gradient(0deg,  rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(90deg, rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(0deg,  rgba(201,74,66,.11) 0 5px,  transparent 5px 48px),
    repeating-linear-gradient(90deg, rgba(201,74,66,.11) 0 5px,  transparent 5px 48px);
  background-attachment:fixed;
}
.wrap{max-width:520px;margin:0 auto;padding:0 17px}

/* ── 뜨개 줄무늬 ─────────────────────────────── */
.knit{
  height:15px;border-radius:8px;overflow:hidden;position:relative;
  background:var(--paper-2);
  box-shadow:inset 0 2px 4px rgba(74,59,50,.16);
}
.knit i{
  display:block;height:100%;border-radius:8px;
  transition:width .8s cubic-bezier(.2,.9,.3,1);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 3px, transparent 3px 8px),
    linear-gradient(90deg,var(--red),var(--mustard),var(--green),var(--sky),var(--plum),var(--pink));
}

/* ── 머리말: 잘라 붙인 종이 ─────────────────── */
header{padding:26px 0 15px}
.cut{display:inline-block;background:#FFFDF7;padding:2px 11px;margin:0 3px 5px 0;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:25px;color:#2E2620;
  box-shadow:1px 2px 0 rgba(74,59,50,.22)}
.cut:nth-child(1){transform:rotate(-2.2deg)}
.cut:nth-child(2){transform:rotate(1.4deg)}
.cut:nth-child(3){transform:rotate(-1deg)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.16em;margin-bottom:9px}
.tide-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}

/* ── 천 조각 카드 ───────────────────────────── */
.card{
  background:var(--paper);border-radius:18px;padding:22px;margin:17px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 10px 22px rgba(74,59,50,.10);
}
.card::before{content:'';position:absolute;inset:7px;border:2px dashed var(--stitch);
  border-radius:12px;pointer-events:none;opacity:.55}
.card.tight{padding:16px 18px}

/* 라벨 액자 — 참고 이미지 3의 틀 */
.label{
  background:#FCF6E8;border:3px solid var(--red);border-radius:13px;
  padding:16px 18px;margin:17px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.13), 0 9px 18px rgba(74,59,50,.10);
}
.label::before{content:'';position:absolute;inset:4px;border:1.5px solid var(--red);
  border-radius:9px;pointer-events:none;opacity:.5}

h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.01em;margin:0}
h2{font-size:20px}
.muted{color:var(--muted);font-size:13.5px}
.center{text-align:center}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ── 헝겊 이름표 ────────────────────────────── */
.tag{display:inline-block;background:var(--green-2);color:#33421F;
  border-radius:99px;padding:3px 13px;font-size:12px;font-family:'Jua';
  box-shadow:0 2px 0 rgba(74,59,50,.16)}
.tag.red{background:var(--red);color:#fff}
.tag.sand{background:var(--paper-2);color:var(--muted)}
.tag.sky{background:var(--sky);color:#1F3A48}

/* ── 단추 버튼 ──────────────────────────────── */
button{
  font-family:'Jua',sans-serif;font-size:15.5px;border:0;cursor:pointer;
  color:var(--ink);background:var(--paper-2);border-radius:15px;padding:13px 18px;
  position:relative;box-shadow:0 3px 0 rgba(74,59,50,.20);
  transition:transform .1s, box-shadow .1s;
}
button::before{content:'';position:absolute;inset:4px;border:1.5px dashed rgba(255,255,255,.7);
  border-radius:11px;pointer-events:none}
button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
button.primary{background:var(--red);color:#FFF6EC}
button.green{background:var(--green);color:#F5FBEF}
button.denim{background:var(--denim);color:#F2F7FB}
button.wide{display:block;width:100%}
button[disabled]{opacity:.45;cursor:not-allowed}
button.sel{background:var(--mustard);color:#3A2C10}

/* ── 천 입력칸 ──────────────────────────────── */
input,textarea{
  font-family:inherit;font-size:16px;color:var(--ink);width:100%;
  background:#FFFDF6;border:2px dashed var(--stitch);border-radius:13px;
  padding:12px 14px;outline:none;
}
input:focus,textarea:focus{border-color:var(--red);border-style:solid}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}

/* ── 일정 조각 ──────────────────────────────── */
.slot{display:flex;gap:13px;align-items:stretch;margin:12px 0;text-align:left;width:100%;
  background:var(--paper);border-radius:16px;padding:14px 15px;font-family:'Gowun Dodum';
  box-shadow:0 3px 0 rgba(74,59,50,.12), 0 7px 14px rgba(74,59,50,.08)}
.slot::before{content:'';position:absolute;inset:5px;border:1.5px dashed var(--stitch);
  border-radius:11px;pointer-events:none;opacity:.5}
.slot .t{font-family:'Jua';font-size:13px;color:var(--red);min-width:44px;padding-top:2px}
.slot .body{flex:1}
.slot .place{font-family:'Jua';font-size:16.5px;display:block}
.slot .desc{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.slot .mark{align-self:center;font-size:18px}
.slot.done{background:var(--green-2)}
.day-head{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
.day-head h2{font-size:18px}
.day-head .knit{flex:1;height:11px}
.day-head .knit i{width:100%}

/* ── 조각보 주머니 (봉인) ───────────────────── */
.pocket{position:relative;border-radius:15px;padding:16px;overflow:hidden;
  background:var(--paper-2);box-shadow:inset 0 2px 6px rgba(74,59,50,.14)}
.pocket .flap{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;color:#3A2C10;z-index:2;
  transition:transform .9s cubic-bezier(.16,1,.3,1);transform-origin:top center;
  background-color:var(--mustard);
  background-image:
    repeating-linear-gradient(0deg,  rgba(255,255,255,.42) 0 9px, transparent 9px 18px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.42) 0 9px, transparent 9px 18px);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);
}
.pocket .flap span{font-family:'Jua';font-size:15px}
.pocket .flap small{font-size:11.5px;opacity:.8}
.pocket.open .flap{transform:rotateX(-105deg)}
.answer{background:#FFFDF6;border-radius:11px;padding:10px 13px;
  border:2px dashed var(--stitch)}
.answer b{font-family:'Jua';font-size:12px;color:var(--red)}

/* ── 사진: 대지에 붙인 인화지 ───────────────── */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{position:relative;border-radius:6px;overflow:hidden;background:#FFFDF6;
  padding:7px 7px 26px;aspect-ratio:3/4;
  box-shadow:0 3px 0 rgba(74,59,50,.14), 0 8px 16px rgba(74,59,50,.12)}
.shot:nth-child(odd){transform:rotate(-1.3deg)}
.shot:nth-child(even){transform:rotate(1.1deg)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:3px}
.shot .who{position:absolute;left:0;right:0;bottom:5px;text-align:center;
  font-size:11.5px;font-family:'Jua';color:var(--muted)}
.shot.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-size:12.5px;background:var(--paper-2);border:2px dashed var(--stitch);padding:7px}
.blurwrap{border-radius:8px;overflow:hidden;background:#FFFDF6;padding:8px;
  box-shadow:0 3px 0 rgba(74,59,50,.14), 0 8px 16px rgba(74,59,50,.12)}
.blurwrap img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  border-radius:3px;transition:filter .7s}

/* 오버레이 촬영 */
.cam{position:relative;border-radius:8px;overflow:hidden;background:#2E2620;
  aspect-ratio:3/4;box-shadow:0 3px 0 rgba(74,59,50,.16), 0 9px 18px rgba(74,59,50,.14)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .ghostimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cam .grid{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.3) 33% 33.4%,transparent 33.4% 66.6%,rgba(255,255,255,.3) 66.6% 67%,transparent 67%),
             linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.3) 33% 33.4%,transparent 33.4% 66.6%,rgba(255,255,255,.3) 66.6% 67%,transparent 67%)}
input[type=range]{border:0;padding:0;background:transparent;accent-color:var(--red)}

/* ── 문제 카드 ──────────────────────────────── */
.qbox{background:#FCF6E8;border:3px solid var(--red);border-radius:15px;
  padding:20px;margin:15px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.13), 0 9px 18px rgba(74,59,50,.10)}
.qbox::before{content:'';position:absolute;inset:4px;border:1.5px solid var(--red);
  border-radius:11px;pointer-events:none;opacity:.45}
.qbox .qt{font-size:18px;font-family:'Jua';line-height:1.48;margin:0 0 14px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:var(--paper)}
.choice.ok{background:var(--green);color:#F5FBEF}
.choice.no{background:var(--red-2);color:#4A2620}

/* ── 아래 데님 띠 ───────────────────────────── */
.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:13px 14px calc(10px + env(safe-area-inset-bottom));
  background-color:#5A7CA3;
  background-image:
    repeating-linear-gradient(45deg,  rgba(255,255,255,.055) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
    linear-gradient(180deg,#6D8FB6,#4C6E95);
}
/* 레이스 가장자리 */
.bottom::before{
  content:'';position:absolute;top:-10px;left:0;right:0;height:11px;
  background:radial-gradient(circle at 8px 11px, #FBF3E2 7.2px, transparent 7.6px) repeat-x;
  background-size:16px 11px;
}
.bottom .inner{max-width:520px;margin:0 auto}
nav{display:flex;gap:8px;margin-top:10px}
nav button{flex:1;padding:10px 3px;font-size:13px;background:rgba(251,243,226,.92);
  box-shadow:0 3px 0 rgba(30,45,60,.35)}

/* 실시간 점수 — 헝겊 이름표 */
.live{display:flex;gap:9px;align-items:center}
.live .p{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--paper);border-radius:13px;padding:7px 14px;
  box-shadow:0 3px 0 rgba(30,45,60,.3)}
.live .p .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .p .n{font-family:'Jua';font-size:22px;line-height:1}
.live .p.lead{background:var(--mustard);color:#3A2C10}
.live .vs{font-size:11px;color:#E4EEF6;font-family:'Jua';min-width:34px;text-align:center}

/* ── 기타 ───────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;font-size:14px;
  transition:.3s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.netbar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#FFF6EC;
  font-size:12.5px;text-align:center;padding:5px;z-index:70;display:none;font-family:'Jua'}
.netbar.on{display:block}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--stitch);
  animation:blink 1.3s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="netbar" id="netbar">오프라인 — 저장해뒀다가 연결되면 자동으로 보냅니다</div>

<div class="wrap">
  <header>
    <div class="eyebrow">2일 · 10개 조각 · 둘</div>
    <div><span class="cut">속초</span><span class="cut">2일,</span><span class="cut">우리 둘</span></div>
    <div class="knit" style="margin-top:10px"><i id="tide" style="width:0%"></i></div>
    <div class="tide-label"><span id="tideL">아직 출발 전</span><span id="tideR">0 / 10</span></div>
  </header>
  <main id="app"></main>
</div>

<div class="bottom"><div class="inner">
  <div class="live" id="live"></div>
  <nav>
    <button onclick="go('home')">일정</button>
    <button onclick="go('slot','show')">퀴즈</button>
    <button onclick="go('album')">앨범</button>
    <button onclick="go('me')">나</button>
  </nav>
</div></div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   0. 설정
   ═══════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbz2bPUmXTWt4BcwQzjNl5HuD-K5e8MYNSd4adNGTUYOXeTcx3lfz7M-ObKiLkMgI3Fo/exec',            // Apps Script 웹앱 URL. 비우면 이 기기에만 저장됩니다.
  USE_DUMMY: true,        // 개발 중 true. 출발 아침에 false 로.
  TRIP_DATE: '2026-08-15',
  POLL_MS: 4000
};

/* ═══════════════════════════════════════════════
   1. 일정
   ═══════════════════════════════════════════════ */
const TRIP = [
  { id:'move',    day:1, time:'08:00', place:'서울 → 고성',  type:'seal',
    desc:'오늘 하루를 미리 봉인합니다', mark:'🧵' },
  { id:'checkin', day:1, time:'10:30', place:'소노캄 체크인', type:'capture', noPhoto:true,
    desc:'방 둘러보고 문제 하나', mark:'🔑',
    hint:'커튼 색, 슬리퍼 개수, 창밖에 보이는 것 — 상대가 놓쳤을 만한 걸로' },
  { id:'lunch',   day:1, time:'11:30', place:'가보오토종닭',  type:'capture',
    desc:'메뉴판 한 장, 문제 하나', mark:'🍗',
    hint:'상대가 뭘 남겼는지, 반찬이 몇 가지였는지 — 지금 봐두세요' },
  { id:'balhae',  day:1, time:'16:00', place:'발해역사관',    type:'ai',
    desc:'패널 찍으면 문제가 나옵니다', mark:'🏛' },
  { id:'brew',    day:1, time:'18:00', place:'크래프트루트',  type:'brew',
    desc:'신메뉴 이름 짓기', mark:'🍺' },
  { id:'show',    day:1, time:'19:30', place:'숙소 퀴즈',     type:'show',
    desc:'오늘 모은 걸 한 문제씩', mark:'🏆' },
  { id:'m2', day:2, time:'12:00', place:'바다정원', type:'mission', mode:'theme', theme:'따뜻한 것',
    desc:'같은 주제 「따뜻한 것」', mark:'☕' },
  { id:'m3', day:2, time:'14:00', place:'바다',     type:'mission', mode:'theme', theme:'이 여행을 한 단어로',
    desc:'같은 주제 「이 여행을 한 단어로」', mark:'🌊' },
  { id:'m4', day:2, time:'15:00', place:'모녀가리비', type:'mission', mode:'overlay',
    desc:'같은 구도 · 상대 사진 겹쳐 찍기', mark:'🐚' },
  { id:'end', day:2, time:'16:30', place:'귀가길',   type:'finale',
    desc:'시상식', mark:'🎬' }
];
const SLOT = id => TRIP.find(s=>s.id===id);

const SEALS = [
  { id:'s3', q:'오늘 상대가 제일 많이 할 말은?', unit:'' }
];

/* ═══════════════════════════════════════════════
   2. 저장소
   ═══════════════════════════════════════════════ */
const mem={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); return v??mem[k]??null; }catch(e){ return mem[k]??null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
const blank = () => ({
  names:{A:'',B:''}, seals:{}, photos:[], customQ:[], aiQ:[],
  beers:{ names:{}, verdict:null },
  show:{ i:0, scores:{A:0,B:0}, ans:{}, truth:{}, graded:{} },
  finale:{ best:{}, titles:{}, orderScore:null },
  rev:0
});
let S=blank(), me=store.get('me')||null, skipWait=false;
try{ const raw=store.get('state'); if(raw) S=Object.assign(blank(),JSON.parse(raw)); }catch(e){}
function save(){ store.set('state',JSON.stringify(S)); push(); }

/* ═══════════════════════════════════════════════
   3. 통신
   ═══════════════════════════════════════════════ */
let online=navigator.onLine, pushing=false, dirty=false;
addEventListener('online', ()=>{ online=true; document.getElementById('netbar').classList.remove('on'); if(dirty)push(); });
addEventListener('offline',()=>{ online=false; document.getElementById('netbar').classList.add('on'); });

async function call(action,payload){
  if(!CONFIG.API_URL) throw new Error('서버가 설정되지 않았습니다');
  const r=await fetch(CONFIG.API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action,payload})
  });
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'서버 오류');
  return j.data;
}
async function push(){
  if(!CONFIG.API_URL) return;
  if(!online||pushing){ dirty=true; return; }
  pushing=true;
  try{ S.rev=Date.now(); await call('setState',{state:S}); dirty=false; }
  catch(e){ dirty=true; } finally{ pushing=false; }
}
async function pull(){
  if(!CONFIG.API_URL||!online) return;
  try{
    const r=await call('getState',{});
    if(r && r.rev>(S.rev||0)){
      S=Object.assign(blank(),r);
      store.set('state',JSON.stringify(S));
      render();
    }
  }catch(e){}
}
setInterval(pull, CONFIG.POLL_MS);

</script>
<script>

/* ═══════════════════════════════════════════════
   4. 사진
   ═══════════════════════════════════════════════ */
function shrink(file,max=1200,q=.8){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('이미지가 아닙니다'));
      img.onload=()=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addPhoto(dataUrl,meta){
  const p=Object.assign({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),
    by:me, ts:Date.now(), local:dataUrl, url:null}, meta);
  S.photos.push(p); save(); render();
  try{ const up=await call('upload',{id:p.id,dataUrl,slot:p.slot}); p.url=up.url; delete p.local; save(); }
  catch(e){}
  return p;
}
const src = p => p.url||p.local||'';
const photosOf = (slot,opt={}) => S.photos.filter(p=>
  p.slot===slot && (!opt.mission||p.mission===opt.mission) && (!opt.by||p.by===opt.by));
async function pick(meta,cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.capture='environment';
  i.onchange=async()=>{
    if(!i.files[0]) return;
    toast('줄이는 중…');
    try{ const d=await shrink(i.files[0]); const p=await addPhoto(d,meta); toast('붙였습니다'); cb&&cb(p); }
    catch(e){ toast(e.message); }

}

/* ═══════════════════════════════════════════════
   5. 날짜 시드 셔플
   ═══════════════════════════════════════════════ */
function mulberry32(a){ return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
};}
function seedOf(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function shuffle(arr,seedStr){
  const rnd=mulberry32(seedOf(seedStr)), a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const DUMMY_Q=[
  { q:'1 + 1 은?', choices:['1','2','3','4'], answer:1 },
  { q:'속초는 어느 도에 있을까?', choices:['강원','경기','충북','전남'], answer:0 },
  { q:'테스트 문항입니다. 두 번째를 고르세요.', choices:['가','나','다','라'], answer:1 }
];

function go(name,arg){ view={name,arg}; scrollTo({top:0,behavior:'smooth'}); render(); }
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2200); }
const other = () => me==='A'?'B':'A';
const other2 = k => k==='A'?'B':'A';
const nameOf = k => S.names[k] || (k==='A'?'왼쪽':'오른쪽');
const bothIn = () => !!(S.names.A && S.names.B);

function isDone(s){
  switch(s.type){
    case 'seal':    return SEALS.every(x=>S.seals[x.id]&&S.seals[x.id][me]!=null);
    case 'capture': return s.noPhoto ? S.customQ.some(q=>q.slot===s.id&&q.by===me)
                                     : photosOf(s.id,{by:me}).length>0;
    case 'ai':      return S.aiQ.length>0;
    case 'brew':    return !!S.beers.names[me];
    case 'show':    return queue().length>0 && S.show.i>=queue().length;
    case 'mission': return photosOf(s.id,{by:me}).length>0;
    case 'finale':  return !!S.finale.best[me];
  }
  return false;
}

function render(){
  const el=document.getElementById('app');
  const bar=document.querySelector('.bottom');
  if(!me || !S.names[me]){ bar.style.display='none'; return screenJoin(); }
  if(!bothIn() && !skipWait){ bar.style.display='none'; return screenWait(); }
  bar.style.display='';

  const n=TRIP.filter(isDone).length;
  document.getElementById('tide').style.width=(n/TRIP.length*100)+'%';
  document.getElementById('tideR').textContent=n+' / '+TRIP.length;
  document.getElementById('tideL').textContent =
    n===0?'아직 출발 전' : n===TRIP.length?'다 채웠습니다' : TRIP.filter(s=>!isDone(s))[0].place+' 차례';

  const sc=S.show.scores, tot=queue().length, at=Math.min(S.show.i,tot);
  document.getElementById('live').innerHTML=`
    <div class="p ${sc.A>sc.B?'lead':''}"><span class="nm">${esc(nameOf('A'))}</span><span class="n">${sc.A}</span></div>
    <span class="vs">${tot? at+'/'+tot : 'vs'}</span>
    <div class="p ${sc.B>sc.A?'lead':''}"><span class="n">${sc.B}</span><span class="nm">${esc(nameOf('B'))}</span></div>`;

  const fn={home:screenHome,slot:screenSlot,album:screenAlbum,me:screenMe}[view.name]||screenHome;
  el.innerHTML=fn();
  el.querySelectorAll('[data-run]').forEach(x=>
    x.addEventListener('click',()=>window[x.dataset.run](x.dataset.a,x.dataset.b)));
  if(view.name==='slot'&&SLOT(view.arg)?.mode==='overlay') setTimeout(startCam,60);
}

async function join(name){
  if(!name) return toast('이름을 적어주세요');
  if(CONFIG.API_URL){
    toast('들어가는 중…');
    try{
      const r=await call('join',{name});
      S=Object.assign(blank(),r.state); me=r.seat;
    }catch(e){ return toast(e.message); }
  }else{
    const n=S.names;
    const seat = n.A===name?'A' : n.B===name?'B' : !n.A?'A' : !n.B?'B' : null;
    if(!seat) return toast('이미 두 사람이 들어와 있습니다');
    n[seat]=name; me=seat;
  }
  store.set('me',me); save(); render(); toast(name+'님, 반갑습니다');
}

/* ── 퀴즈: 한 문제씩 ─────────────────────────── */
function queue(){
  const out=[];
  S.customQ.forEach(q=>out.push({id:q.id,kind:'free',text:q.q,truth:q.a,by:q.by,from:SLOT(q.slot).place}));
  S.aiQ.forEach((q,i)=>out.push({id:'ai'+i,kind:'choice',text:q.q,choices:q.choices,truth:q.answer,from:'발해역사관'}));
  const pool=S.photos.filter(p=>['lunch','balhae','brew'].includes(p.slot));
  shuffle(pool,CONFIG.TRIP_DATE+'blur').slice(0,2).forEach((p,i)=>out.push({
    id:'ph'+i,kind:'photo',text:'이 사진, 어디서 찍었게?',photo:p,truth:SLOT(p.slot).place,from:'가려진 사진'}));
  if(S.beers.names.A&&S.beers.names.B) out.push({id:'beer',kind:'beer',from:'양조장'});
  SEALS.forEach(x=>out.push({id:'sl_'+x.id,kind:'seal',text:x.q,from:'아침 봉인'}));
  return out;
}
function askers(q){
  if(q.kind==='free'||q.kind==='photo') return q.by?[other2(q.by)]:['A','B'];
  if(q.kind==='choice') return ['A','B'];
  return [];
}
const ansOf = qid => S.show.ans[qid]||{};

function vShow(){
  const Q=queue();
  if(!Q.length) return `<div class="card center"><p class="muted" style="margin:0">
    아직 문제가 없습니다. 낮에 사진 찍고 문제를 만들어 두세요.</p></div>`;
  if(S.show.i>=Q.length) return vShowEnd(Q);

  const q=Q[S.show.i], need=askers(q), a=ansOf(q.id);
  const allIn=need.every(k=>a[k]!=null), graded=S.show.graded[q.id];
  let h=`<div class="card tight" style="display:flex;justify-content:space-between;align-items:center">
    <span class="tag red">${S.show.i+1} / ${Q.length}</span>
    <span class="muted" style="font-size:12.5px">${esc(q.from)}</span></div>`;

  if(q.kind==='beer'){
    const n=S.beers.names, v=S.beers.verdict;
    h+=`<div class="qbox"><div class="qt">어느 쪽이 더 그럴듯한 맥주 이름일까</div>
      <div class="stack">
        <div class="answer"><b>1번</b><div>${esc(n.A)}</div></div>
        <div class="answer"><b>2번</b><div>${esc(n.B)}</div></div></div>`;
    h+= v ? `<div class="answer" style="margin-top:13px;border-style:solid;border-color:var(--green)">
             <b>${esc(nameOf(v.order[v.winner]))} 승</b><div>${esc(v.why)}</div></div>`
          : `<button class="green wide" style="margin-top:14px" data-run="judgeNames">
             ⚖️ AI 심사 받기 ${CONFIG.USE_DUMMY?'(더미)':''}</button>`;
    return h+`</div>`+(v?nextBtn():'');
  }

  if(q.kind==='seal'){
    const rec=S.seals[q.id.slice(3)]||{};
    h+=`<div class="qbox"><div class="qt">${esc(q.text)}</div>
      <div class="stack">
        <div class="answer"><b>${esc(nameOf('A'))}</b><div>${esc(rec.A??'—')}</div></div>
        <div class="answer"><b>${esc(nameOf('B'))}</b><div>${esc(rec.B??'—')}</div></div></div>
      <label>실제로는?</label>
      <div class="row"><input id="tr" value="${esc(S.show.truth[q.id]??'')}" placeholder="결과 입력">
      <button style="flex:0 0 70px" data-run="setTruth" data-a="${q.id}">확인</button></div>`;
    if(S.show.truth[q.id]) h+=`<div class="answer" style="margin-top:13px;border-style:solid;border-color:var(--green)">
      <b>정답</b><div>${esc(S.show.truth[q.id])}</div></div>`+gradeRow(q);
    return h+`</div>`+(graded?nextBtn():'');
  }

  h+=`<div class="qbox">`;
  if(q.photo) h+=`<div class="blurwrap" style="margin-bottom:15px">
    <img src="${src(q.photo)}" style="filter:blur(${allIn?0:22}px)" alt=""></div>`;
  h+=`<div class="qt">${esc(q.text)}</div>`;

  if(q.kind==='choice'){
    const my=a[me];
    q.choices.forEach((c,j)=>{
      const cls = allIn ? (j===q.truth?'ok':(my===j?'no':'')) : (my===j?'sel':'');
      h+=`<button class="choice ${cls}" ${allIn?'disabled':''}
           data-run="answer" data-a="${q.id}" data-b="${j}">${'①②③④'[j]||''} ${esc(c)}</button>`;
    });
  } else if(need.includes(me)&&a[me]==null){
    h+=`<div class="row"><input id="ai_${q.id}" placeholder="내 답">
        <button class="primary" style="flex:0 0 70px" data-run="answer" data-a="${q.id}">제출</button></div>`;
  }

  if(!allIn){
    const wait=need.filter(k=>a[k]==null);
    h+=`<p class="muted center" style="margin-bottom:0">
      ${need.includes(me)&&a[me]==null?'답을 넣어주세요':nameOf(wait[0])+' 기다리는 중'}</p>`;
  }else{
    if(q.kind!=='choice') h+=`<div class="stack" style="margin-top:13px">
      ${need.map(k=>`<div class="answer"><b>${esc(nameOf(k))}</b><div>${esc(a[k])}</div></div>`).join('')}
      <div class="answer" style="border-style:solid;border-color:var(--green)"><b>정답</b><div>${esc(q.truth)}</div></div>
    </div>`;
    h+=gradeRow(q);
  }
  return h+`</div>`+(graded?nextBtn():'');
}
function gradeRow(q){
  const g=S.show.graded[q.id];
  if(g) return `<p class="center jua" style="font-size:17px;margin:15px 0 0">
    ${g==='none'?'둘 다 못 맞혔습니다':g==='both'?'둘 다 정답 🎉':esc(nameOf(g))+' 정답 +1'}</p>`;
  if(q.kind==='choice'){
    const a=ansOf(q.id);
    const auto = a.A===q.truth&&a.B===q.truth?'both' : a.A===q.truth?'A' : a.B===q.truth?'B' : 'none';
    setTimeout(()=>grade(q.id,auto),0);
    return '';
  }
  return `<p class="muted center" style="margin:15px 0 7px">누가 맞혔나요?</p>
    <div class="row">
      <button class="primary" data-run="grade" data-a="${q.id}" data-b="A">${esc(nameOf('A'))}</button>
      <button class="primary" data-run="grade" data-a="${q.id}" data-b="B">${esc(nameOf('B'))}</button></div>
    <div class="row" style="margin-top:9px">
      <button data-run="grade" data-a="${q.id}" data-b="both">둘 다</button>
      <button data-run="grade" data-a="${q.id}" data-b="none">아무도</button></div>`;
}
const nextBtn = () => `<button class="denim wide" data-run="nextQ">다음 문제 →</button>`;
function answer(qid,choice){
  const v = choice!=null ? Number(choice) : document.getElementById('ai_'+qid).value.trim();
  if(v==='') return toast('답을 넣어주세요');
  S.show.ans[qid]=S.show.ans[qid]||{}; S.show.ans[qid][me]=v; save(); render();
}
function grade(qid,who){
  if(S.show.graded[qid]) return;
  S.show.graded[qid]=who;
  if(who==='both'){ S.show.scores.A++; S.show.scores.B++; }
  else if(who==='A'||who==='B') S.show.scores[who]++;
  save(); render();
}
function setTruth(qid){
  const v=document.getElementById('tr').value.trim();
  if(!v) return toast('결과를 넣어주세요');
  S.show.truth[qid]=v; save(); render();
}
function nextQ(){ S.show.i++; save(); render(); }
function prevQ(){ if(S.show.i>0){ S.show.i--; save(); render(); } }
function vShowEnd(Q){
  const sc=S.show.scores;
  return `<div class="label center">
    <div class="jua" style="font-size:22px">${sc.A===sc.B?'무승부':esc(nameOf(sc.A>sc.B?'A':'B'))+' 우승 🏆'}</div>
    <p class="muted" style="margin:6px 0 0">${Q.length}문제 · ${sc.A} 대 ${sc.B}</p></div>
  <div class="card center"><p class="muted" style="margin-top:0">우승자가 내일 메뉴를 정합니다.</p>
    <button class="wide" data-run="prevQ">마지막 문제 다시 보기</button>
    <button class="wide" style="margin-top:9px" data-run="resetShow">처음부터 다시</button></div>`;
}
function resetShow(){
  if(!confirm('점수와 답을 모두 지우고 처음부터 다시 할까요?')) return;
  S.show={i:0,scores:{A:0,B:0},ans:{},truth:{},graded:{}};
  S.beers.verdict=null; save(); render();
}
async function judgeNames(){
  const n=S.beers.names;
  const order=shuffle(['A','B'],CONFIG.TRIP_DATE+'judge');
  const done=v=>{ S.beers.verdict=v; grade('beer',v.order[v.winner]); };
  if(CONFIG.USE_DUMMY){
    done({order,winner:0,why:'더미 심사입니다. 실전에서는 AI가 이유를 씁니다.'});
    return toast('더미 판정 (개발용)');
  }
  toast('심사 중…');
  try{
    const out=await call('judgeNames',{names:[n[order[0]],n[order[1]]]});
    done({order,winner:out.winner,why:out.why}); toast('판정이 나왔습니다');
  }catch(e){ toast('실패: '+e.message); }
}

/* ── 2일차 사진 미션 ─────────────────────────── */
function vMission(s){
  const mine=photosOf(s.id,{by:me})[0], yours=photosOf(s.id,{by:other()})[0];
  const both=mine&&yours;
  let h=`<div class="card"><p class="muted" style="margin-top:0">${
    s.mode==='theme'?'주제 하나, 각자 5분, 한 장씩. 정답은 없습니다.'
                    :'상대 사진을 화면에 겹쳐 두고 맞춰서 찍습니다.'}</p>`;
  if(s.theme) h+=`<div class="center" style="margin:15px 0">
    <span class="tag red" style="font-size:16px;padding:8px 20px">${esc(s.theme)}</span></div>`;

  if(s.mode==='overlay'){
    h+= yours
      ? `<div class="cam"><video id="v" playsinline muted></video>
         <img class="ghostimg" src="${src(yours)}" style="opacity:${peek.op ?? 0.3}" alt="">
         <div class="grid"></div></div>
         <label>겹친 사진 진하기</label>
         <input type="range" min="10" max="70" value="${(peek.op ?? 0.3)*100}"
           oninput="peek.op=this.value/100;document.querySelector('.ghostimg').style.opacity=peek.op">
         <button class="primary wide" style="margin-top:11px" data-run="snap" data-a="${s.id}">📸 지금 찍기</button>
         <button class="wide" style="margin-top:9px" data-run="capShot" data-a="${s.id}">앨범에서 고르기</button>`
      : `<p class="muted">${esc(nameOf(other()))}가 먼저 찍어야 겹칠 사진이 생깁니다.</p>
         <button class="primary wide" data-run="capShot" data-a="${s.id}">📷 내가 먼저 찍기</button>`;
  }else{
    h+=`<button class="primary wide" data-run="capShot" data-a="${s.id}">📷 내 사진 붙이기</button>`;
  }
  h+=`<div class="shots" style="margin-top:17px">
    <div class="shot ${mine?'':'empty'}">${mine?`<img src="${src(mine)}" alt=""><span class="who">${esc(nameOf(me))}</span>`:'내 사진'}</div>
    <div class="shot ${both?'':'empty'}">${both?`<img src="${src(yours)}" alt=""><span class="who">${esc(nameOf(other()))}</span>`
      :(yours?'🧵 내가 올리면 열림':'상대 대기 중')}</div>
  </div></div>`;
  return h;
}
let camStream=null;
async function startCam(){
  const v=document.getElementById('v'); if(!v) return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    v.srcObject=camStream; await v.play();
  }catch(e){ toast('카메라를 열 수 없습니다 — 앨범에서 고르세요'); }
}
async function snap(slot){
  const v=document.getElementById('v'); if(!v||!v.videoWidth) return toast('카메라 준비 중입니다');
  const c=document.createElement('canvas');
  const sc=Math.min(1,1200/Math.max(v.videoWidth,v.videoHeight));
  c.width=v.videoWidth*sc; c.height=v.videoHeight*sc;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  await addPhoto(c.toDataURL('image/jpeg',.8),{slot});
  camStream&&camStream.getTracks().forEach(t=>t.stop());
  toast('찍었습니다');
}

/* ── 결산 ────────────────────────────────────── */
function vFinale(){
  const yours=S.photos.filter(p=>p.by===other());
  const picked=S.finale.best[me];
  const pool=shuffle(S.photos.slice(),CONFIG.TRIP_DATE+'order').slice(0,8);
  const sc=S.show.scores;
  let h=`<div class="label center"><div class="jua" style="font-size:19px">
    ${sc.A===sc.B?'무승부입니다':esc(nameOf(sc.A>sc.B?'A':'B'))+' 우승 🏆'}</div>
    <p class="muted" style="margin:5px 0 0">${sc.A} 대 ${sc.B}</p></div>`;

  h+=`<div class="card"><div class="jua">${esc(nameOf(other()))}의 사진 중 베스트</div>
    <p class="muted" style="margin-top:2px">한 장 고르고, 제목을 붙여주세요.</p>
    <div class="shots">${yours.length? yours.map(p=>
      `<div class="shot" style="${picked===p.id?'box-shadow:0 0 0 4px var(--red)':''}">
        <img src="${src(p)}" alt="" data-run="pickBest" data-a="${p.id}"></div>`).join('')
      :`<div class="shot empty">상대 사진 없음</div><div class="shot empty">－</div>`}</div>`;
  if(picked) h+=`<label>제목 붙이기</label>
    <div class="row"><input id="ttl" value="${esc(S.finale.titles[picked]??'')}" placeholder="예) 파도보다 먼저 웃은 사람">
    <button class="primary" style="flex:0 0 70px" data-run="setTitle">저장</button></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="jua">시간순 맞히기</div>
    <p class="muted" style="margin-top:2px">찍은 순서대로 눌러주세요.</p>
    <div class="shots">${pool.map(p=>{
      const n=(peek.order||[]).indexOf(p.id);
      return `<div class="shot" style="${n>=0?'box-shadow:0 0 0 4px var(--green)':''}">
        <img src="${src(p)}" alt="" data-run="tapOrder" data-a="${p.id}">
        ${n>=0?`<span class="who">${n+1}</span>`:''}</div>`;}).join('')}</div>
    <div class="row" style="margin-top:13px">
      <button data-run="resetOrder">다시</button>
      <button class="green" data-run="gradeOrder">채점</button></div>
    ${S.finale.orderScore!=null?`<p class="center jua" style="font-size:18px;margin-bottom:0">
      ${pool.length}장 중 ${S.finale.orderScore}장 정확</p>`:''}</div>
  <div class="card center"><p class="muted" style="margin:0">
    사진 ${S.photos.length}장 · 문제 ${S.customQ.length+S.aiQ.length}개 · 봉인 ${SEALS.length}건</p></div>`;
  return h;
}
function pickBest(id){ S.finale.best[me]=id; save(); render(); }
function setTitle(){
  S.finale.titles[S.finale.best[me]]=document.getElementById('ttl').value.trim();
  save(); toast('제목을 저장했습니다');
}
function tapOrder(id){
  peek.order=peek.order||[];
  const i=peek.order.indexOf(id);
  i>=0? peek.order.splice(i,1) : peek.order.push(id);
  render();
}
function resetOrder(){ peek.order=[]; S.finale.orderScore=null; save(); render(); }
function gradeOrder(){
  const chosen=(peek.order||[]).map(id=>S.photos.find(p=>p.id===id)).filter(Boolean);
  if(chosen.length<2) return toast('두 장 이상 골라주세요');
  const truth=chosen.slice().sort((a,b)=>a.ts-b.ts);
  S.finale.orderScore=chosen.filter((p,i)=>truth[i].id===p.id).length;
  save(); render();
}

/* ── 앨범 / 나 ───────────────────────────────── */
function screenAlbum(){
  if(!S.photos.length) return `<div class="card center"><p class="muted" style="margin:0">
    아직 한 장도 없습니다.</p></div>`;
  let h='';
  TRIP.forEach(s=>{
    const ps=photosOf(s.id); if(!ps.length) return;
    h+=`<div class="card"><span class="tag sand">${s.day}일차 ${s.time}</span>
      <div class="jua" style="margin:8px 0 13px">${s.mark} ${esc(s.place)}</div>
      <div class="shots">${ps.map(p=>{
        const t=S.finale.titles[p.id];
        return `<div class="shot"><img src="${src(p)}" alt="">
          <span class="who">${t?esc(t):esc(nameOf(p.by))}</span></div>`;}).join('')}</div></div>`;
  });
  return h;
}
function screenMe(){
  return `<div class="card">
    <div class="jua" style="font-size:19px">${esc(nameOf(me))}</div>
    <p class="muted">내 사진 ${S.photos.filter(p=>p.by===me).length}장 ·
      내가 낸 문제 ${S.customQ.filter(q=>q.by===me).length}개</p>
    <p class="muted">함께: ${esc(nameOf(other()))||'아직 없음'}</p>
    <p class="muted">${CONFIG.API_URL?(online?'연결됨':'오프라인 — 임시 저장 중'):'서버 없음 — 이 기기에만'}
      ${CONFIG.USE_DUMMY?' · 더미 모드':''}</p>
    <button class="wide" style="margin-top:8px" data-run="leave">나가기</button>
    <button class="wide" style="margin-top:9px" data-run="wipe">전부 지우기</button></div>`;
}
function leave(){ S.names[me]=''; me=null; store.set('me',''); skipWait=false; save(); render(); }
function wipe(){ if(confirm('사진과 점수까지 전부 지웁니다. 계속할까요?')){ S=blank(); me=null; store.set('me',''); save(); render(); } }

render(); pull();

</script>
</body>
