<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEDC">
<title>속초 2일, 우리 둘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   천 조각 · 자수 · 조각보
   ═══════════════════════════════════════════════ */
:root{
  --paper:#FBF3E2;      /* 무명천 */
  --paper-2:#F2E6CC;
  --red:#C94A42;        /* 빨강 실 */
  --red-2:#E68B7E;
  --green:#6B9A52;      /* 초록 실 */
  --green-2:#A9C68A;
  --denim:#5A7CA3;      /* 데님 */
  --denim-d:#456B8E;
  --mustard:#E0A93A;
  --pink:#E4989E;
  --plum:#8878B0;
  --sky:#8CBBD4;
  --ink:#4A3B32;        /* 갈색 잉크 */
  --muted:#8A7663;
  --stitch:#C9A98A;     /* 실 색 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font-family:'Gowun Dodum',system-ui,sans-serif;
  font-size:16px;line-height:1.68;
  padding:0 0 152px;
  overscroll-behavior-y:contain;
  /* 수채 체크 바탕 */
  background-color:#F4EEDD;
  background-image:
    repeating-linear-gradient(0deg,  rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(90deg, rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(0deg,  rgba(201,74,66,.11) 0 5px,  transparent 5px 48px),
    repeating-linear-gradient(90deg, rgba(201,74,66,.11) 0 5px,  transparent 5px 48px);
  background-attachment:fixed;
}
.wrap{max-width:520px;margin:0 auto;padding:0 17px}

/* ── 뜨개 줄무늬 ─────────────────────────────── */
.knit{
  height:15px;border-radius:8px;overflow:hidden;position:relative;
  background:var(--paper-2);
  box-shadow:inset 0 2px 4px rgba(74,59,50,.16);
}
.knit i{
  display:block;height:100%;border-radius:8px;
  transition:width .8s cubic-bezier(.2,.9,.3,1);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 3px, transparent 3px 8px),
    linear-gradient(90deg,var(--red),var(--mustard),var(--green),var(--sky),var(--plum),var(--pink));
}

/* ── 머리말: 잘라 붙인 종이 ─────────────────── */
header{padding:26px 0 15px}
.cut{display:inline-block;background:#FFFDF7;padding:2px 11px;margin:0 3px 5px 0;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:25px;color:#2E2620;
  box-shadow:1px 2px 0 rgba(74,59,50,.22)}
.cut:nth-child(1){transform:rotate(-2.2deg)}
.cut:nth-child(2){transform:rotate(1.4deg)}
.cut:nth-child(3){transform:rotate(-1deg)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.16em;margin-bottom:9px}
.tide-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}

/* ── 천 조각 카드 ───────────────────────────── */
.card{
  background:var(--paper);border-radius:18px;padding:22px;margin:17px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 10px 22px rgba(74,59,50,.10);
}
.card::before{content:'';position:absolute;inset:7px;border:2px dashed var(--stitch);
  border-radius:12px;pointer-events:none;opacity:.55}
.card.tight{padding:16px 18px}

/* 라벨 액자 — 참고 이미지 3의 틀 */
.label{
  background:#FCF6E8;border:3px solid var(--red);border-radius:13px;
  padding:16px 18px;margin:17px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.13), 0 9px 18px rgba(74,59,50,.10);
}
.label::before{content:'';position:absolute;inset:4px;border:1.5px solid var(--red);
  border-radius:9px;pointer-events:none;opacity:.5}

h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.01em;margin:0}
h2{font-size:20px}
.muted{color:var(--muted);font-size:13.5px}
.center{text-align:center}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ── 헝겊 이름표 ────────────────────────────── */
.tag{display:inline-block;background:var(--green-2);color:#33421F;
  border-radius:99px;padding:3px 13px;font-size:12px;font-family:'Jua';
  box-shadow:0 2px 0 rgba(74,59,50,.16)}
.tag.red{background:var(--red);color:#fff}
.tag.sand{background:var(--paper-2);color:var(--muted)}
.tag.sky{background:var(--sky);color:#1F3A48}

/* ── 단추 버튼 ──────────────────────────────── */
button{
  font-family:'Jua',sans-serif;font-size:15.5px;border:0;cursor:pointer;
  color:var(--ink);background:var(--paper-2);border-radius:15px;padding:13px 18px;
  position:relative;box-shadow:0 3px 0 rgba(74,59,50,.20);
  transition:transform .1s, box-shadow .1s;
}
button::before{content:'';position:absolute;inset:4px;border:1.5px dashed rgba(255,255,255,.7);
  border-radius:11px;pointer-events:none}
button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
button.primary{background:var(--red);color:#FFF6EC}
button.green{background:var(--green);color:#F5FBEF}
button.denim{background:var(--denim);color:#F2F7FB}
button.wide{display:block;width:100%}
button[disabled]{opacity:.45;cursor:not-allowed}
button.sel{background:var(--mustard);color:#3A2C10}

/* ── 천 입력칸 ──────────────────────────────── */
input,textarea{
  font-family:inherit;font-size:16px;color:var(--ink);width:100%;
  background:#FFFDF6;border:2px dashed var(--stitch);border-radius:13px;
  padding:12px 14px;outline:none;
}
input:focus,textarea:focus{border-color:var(--red);border-style:solid}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}

/* ── 일정 조각 ──────────────────────────────── */
.slot{display:flex;gap:13px;align-items:stretch;margin:12px 0;text-align:left;width:100%;
  background:var(--paper);border-radius:16px;padding:14px 15px;font-family:'Gowun Dodum';
  box-shadow:0 3px 0 rgba(74,59,50,.12), 0 7px 14px rgba(74,59,50,.08)}
.slot::before{content:'';position:absolute;inset:5px;border:1.5px dashed var(--stitch);
  border-radius:11px;pointer-events:none;opacity:.5}
.slot .t{font-family:'Jua';font-size:13px;color:var(--red);min-width:44px;padding-top:2px}
.slot .body{flex:1}
.slot .place{font-family:'Jua';font-size:16.5px;display:block}
.slot .desc{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.slot .mark{align-self:center;font-size:18px}
.slot.done{background:var(--green-2)}
.day-head{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
.day-head h2{font-size:18px}
.day-head .knit{flex:1;height:11px;min-width:52px}

/* ── 조각보 주머니 (봉인) ───────────────────── */
.pocket{position:relative;border-radius:15px;padding:16px;overflow:hidden;
  background:var(--paper-2);box-shadow:inset 0 2px 6px rgba(74,59,50,.14)}
.pocket .flap{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;color:#3A2C10;z-index:2;
  transition:transform .9s cubic-bezier(.16,1,.3,1);transform-origin:top center;
  background-color:var(--mustard);
  background-image:
    repeating-linear-gradient(0deg,  rgba(255,255,255,.42) 0 9px, transparent 9px 18px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.42) 0 9px, transparent 9px 18px);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);
}
.pocket .flap span{font-family:'Jua';font-size:15px}
.pocket .flap small{font-size:11.5px;opacity:.8}
.pocket.open .flap{transform:rotateX(-105deg)}
.answer{background:#FFFDF6;border-radius:11px;padding:10px 13px;
  border:2px dashed var(--stitch)}
.answer b{font-family:'Jua';font-size:12px;color:var(--red)}
.answer.ok{border-style:solid;border-color:var(--green);background:#F4FAEE}
.answer.no{border-style:solid;border-color:var(--stitch);opacity:.72}
.answer .mk{float:right;font-family:'Jua';font-size:13px}
.answer.ok .mk{color:var(--green)}
.answer.no .mk{color:var(--muted)}

/* ── 사진: 대지에 붙인 인화지 ───────────────── */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{position:relative;border-radius:6px;overflow:hidden;background:#FFFDF6;
  padding:7px 7px 26px;aspect-ratio:3/4;
  box-shadow:0 3px 0 rgba(74,59,50,.14), 0 8px 16px rgba(74,59,50,.12)}
.shot:nth-child(odd){transform:rotate(-1.3deg)}
.shot:nth-child(even){transform:rotate(1.1deg)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:3px;
  background:var(--paper-2) repeating-linear-gradient(45deg,rgba(201,169,138,.22) 0 8px,transparent 8px 16px)}
.shot .who{position:absolute;left:0;right:0;bottom:5px;text-align:center;
  font-size:11.5px;font-family:'Jua';color:var(--muted)}
.shot.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-size:12.5px;background:var(--paper-2);border:2px dashed var(--stitch);padding:7px}
.blurwrap{border-radius:8px;overflow:hidden;background:#FFFDF6;padding:8px;
  box-shadow:0 3px 0 rgba(74,59,50,.14), 0 8px 16px rgba(74,59,50,.12)}
.blurwrap img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
  border-radius:3px;transition:filter .7s}

/* ── 색 모으기 판 ───────────────────────────── */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  background:#FFFDF6;padding:9px;border-radius:8px;
  box-shadow:0 3px 0 rgba(74,59,50,.14), 0 8px 16px rgba(74,59,50,.12)}
.cell{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--paper-2);
  border:2px dashed var(--stitch);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);position:relative}
.cell img{width:100%;height:100%;object-fit:cover;display:block;
  background:var(--paper-2) repeating-linear-gradient(45deg,rgba(201,169,138,.22) 0 8px,transparent 8px 16px)}
.cell.mid{border:3px solid var(--red)}
.cell.고름{border:3px solid var(--mustard);box-shadow:0 0 0 3px rgba(224,169,58,.35)}
.cell .pct{position:absolute;right:3px;bottom:3px;background:rgba(255,253,246,.92);
  border-radius:99px;padding:0 6px;font-size:10px;font-family:'Jua'}
.swatch{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;
  box-shadow:0 0 0 3px #FFFDF6, 0 0 0 5px rgba(74,59,50,.18)}
.chip{display:flex;align-items:center;gap:10px;background:var(--paper-2);
  border-radius:13px;padding:11px 15px;margin:13px 0}
.chip .big{font-family:'Jua';font-size:17px}

/* ── 자르기 창 ──────────────────────────────── */
#cropper{position:fixed;inset:0;background:rgba(46,38,32,.92);z-index:80;
  display:none;align-items:center;justify-content:center;padding:18px}
#cropper.on{display:flex}
#cropper .box{background:var(--paper);border-radius:20px;padding:18px;max-width:370px;width:100%}
#cropper canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#2E2620;
  touch-action:none;display:block;cursor:grab}
#cropper .hint{font-size:12.5px;color:var(--muted);text-align:center;margin:11px 0 4px}

input[type=range]{border:0;padding:0;background:transparent;accent-color:var(--red)}

/* ── 문제 카드 ──────────────────────────────── */
.qbox{background:#FCF6E8;border:3px solid var(--red);border-radius:15px;
  padding:20px;margin:15px 0;position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.13), 0 9px 18px rgba(74,59,50,.10)}
.qbox::before{content:'';position:absolute;inset:4px;border:1.5px solid var(--red);
  border-radius:11px;pointer-events:none;opacity:.45}
.qbox .qt{font-size:18px;font-family:'Jua';line-height:1.48;margin:0 0 14px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:var(--paper)}
.choice.ok{background:var(--green);color:#F5FBEF}
.choice.no{background:var(--red-2);color:#4A2620}

/* ── 아래 데님 띠 ───────────────────────────── */
.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:13px 14px calc(10px + env(safe-area-inset-bottom));
  background-color:#5A7CA3;
  background-image:
    repeating-linear-gradient(45deg,  rgba(255,255,255,.055) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
    linear-gradient(180deg,#6D8FB6,#4C6E95);
}
/* 레이스 가장자리 */
.bottom::before{
  content:'';position:absolute;top:-10px;left:0;right:0;height:11px;
  background:radial-gradient(circle at 8px 11px, #FBF3E2 7.2px, transparent 7.6px) repeat-x;
  background-size:16px 11px;
}
.bottom .inner{max-width:520px;margin:0 auto}
nav{display:flex;gap:8px;margin-top:10px}
nav button{flex:1;padding:10px 3px;font-size:13px;background:rgba(251,243,226,.92);
  box-shadow:0 3px 0 rgba(30,45,60,.35)}

/* 실시간 점수 — 헝겊 이름표 */
.live{display:flex;gap:9px;align-items:center}
.live .p{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--paper);border-radius:13px;padding:7px 14px;
  box-shadow:0 3px 0 rgba(30,45,60,.3)}
.live .p .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .p .n{font-family:'Jua';font-size:22px;line-height:1}
.live .p.lead{background:var(--mustard);color:#3A2C10}
.live .vs{font-size:11px;color:#E4EEF6;font-family:'Jua';min-width:34px;text-align:center}

/* ── 기타 ───────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;font-size:14px;
  transition:.3s;pointer-events:none;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.netbar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#FFF6EC;
  font-size:12.5px;text-align:center;padding:5px;z-index:70;display:none;font-family:'Jua'}
.netbar.on{display:block}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--stitch);
  animation:blink 1.3s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 인쇄하면 조작 요소는 빼고 내용만 */
@media print{
  body{background:#fff;padding:0}
  .bottom,#toast,#cropper,.netbar,header .knit,.tide-label,button{display:none!important}
  .card,.label,.qbox{box-shadow:none;border-color:#999;break-inside:avoid;page-break-inside:avoid}
  .card::before,.label::before,.qbox::before{display:none}
  .board{break-inside:avoid;page-break-inside:avoid}
  .shot{break-inside:avoid}
}
</style>
</head>
<body>

<script>
/* 아래 코드에서 문법 오류가 나면 그 블록이 통째로 실행되지 않습니다.
   그때 진짜 원인을 알 수 있도록 가장 먼저 오류를 받아 둡니다. */
window.__firstError = null;
window.addEventListener('error', function (e) {
  if (window.__firstError) return;
  window.__firstError = (e.message || '오류') +
    (e.filename ? ('\n' + String(e.filename).split('/').pop()) : '') +
    (e.lineno ? (' ' + e.lineno + '번째 줄 ' + (e.colno || 0) + '칸') : '');
});
/* 무엇이 잘못돼도 되돌릴 수 있는 최소 기능. 앱 코드에 기대지 않습니다. */
window.__reset = function () {
  try { localStorage.clear(); } catch (x) {}
  location.replace(location.pathname + '?v=' + Date.now());
};
</script>

<div class="netbar" id="netbar">오프라인 — 저장해뒀다가 연결되면 자동으로 보냅니다</div>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">2일 · 둘</div>
    <div><span class="cut">속초</span><span class="cut">2일,</span><span class="cut">우리 둘</span></div>
    <div class="knit" style="margin-top:10px"><i id="tide" style="width:0%"></i></div>
    <div class="tide-label"><span id="tideL">아직 출발 전</span><span id="tideR">0 / 10</span></div>
  </header>
  <main id="app"></main>
</div>

<div class="bottom"><div class="inner">
  <div class="live" id="live"></div>
  <nav>
    <button onclick="go('home')">일정</button>
    <button onclick="go('album')">앨범</button>
    <button onclick="go('me')">나</button>
  </nav>
</div></div>

<div id="cropper">
  <div class="box">
    <canvas id="cropcv"></canvas>
    <div class="hint">끌어서 옮기고, 아래로 크기를 맞추세요</div>
    <input type="range" id="zoom" min="100" max="220" value="100"
           oninput="zoomCrop(+this.value)">
    <div class="row" style="margin-top:13px">
      <button onclick="closeCrop()">취소</button>
      <button class="primary" onclick="doneCrop()">이 부분으로</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

   0. 설정
   ═══════════════════════════════════════════════ */
const CONFIG = {
  API_URL: '',            // Apps Script 웹앱 URL. 비우면 이 기기에만 저장됩니다.
  USE_DUMMY: false,       // 실전. true 로 두면 테스트 문항만 나옵니다.

  POLL_MS: 4000
};

/* ═══════════════════════════════════════════════
   1. 일정
   ═══════════════════════════════════════════════ */
const TRIP = [

  { id:'checkin', day:1, time:'10:30', place:'소노캄 체크인', type:'capture', noPhoto:true,
    desc:'방 둘러보고 문제 하나', mark:'🔑',
    hint:'커튼 색, 슬리퍼 개수, 창밖에 보이는 것 — 상대가 놓쳤을 만한 걸로' },
  // 박물관에 안 가게 되면 책이나 안내문을 찍어도 됩니다. 이름만 바꾸시면 돼요.
  { id:'balhae',  day:1, time:'16:00', place:'읽을거리',   type:'ai',
    desc:'글 찍으면 문제가 나옵니다', mark:'📖' },
  { id:'brew',    day:1, time:'18:00', place:'크래프트루트',  type:'brew',
    desc:'신메뉴 이름 짓기', mark:'🍺' },
  { id:'show',    day:1, time:'19:30', place:'숙소 퀴즈',     type:'show',
    desc:'오늘 모은 걸 한 문제씩', mark:'🏆' },
  { id:'color', day:2, time:'11:00~', place:'색 모으기', type:'color',
    desc:'여덟 칸 + 가운데 한 장 · 아무 때나', mark:'🎨' },

/* 예전 버전으로 저장된 기록을 새 구조에 맞춰 채웁니다.
   얕게 합치면 안쪽 객체가 통째로 옛것으로 덮여서 키가 사라집니다. */
function hydrate(raw){
  const b=blank();
  if(!raw||typeof raw!=='object') return b;
  const out=Object.assign(b,raw);
  ['names','seen','colors','seals','warm','beers','show','finale','guesses'].forEach(k=>{
    if(k in b) out[k]=Object.assign({},b[k],raw[k]||{});
  });
  out.beers.names  = Object.assign({}, (raw.beers&&raw.beers.names)||{});
  ['ans','truth','graded'].forEach(k=>{ if(!out.show[k]||typeof out.show[k]!=='object') out.show[k]={}; });
  if(typeof out.show.i!=='number') out.show.i=0;
  ['best','titles'].forEach(k=>{ if(!out.finale[k]) out.finale[k]={}; });
  ['photos','customQ','aiQ','aiUsed'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  if(out.colorsV!==2){ out.colors={A:null,B:null}; out.colorsV=2; }   // 색 새로 뽑기
  return out;
}

    return ((pa&&pa.ts)||0)-((pb&&pb.ts)||0);                          // 그다음 오래된 것부터

async function call(action,payload){
  if(!CONFIG.API_URL) throw new Error('서버가 설정되지 않았습니다');
  const r=await fetch(CONFIG.API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action,payload})
  });
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'서버 오류');
  return j.data;
}

function shrink(file,max=1200,q=.8){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('이미지가 아닙니다'));
      img.onload=()=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  if(p.mission==='mid'){
    S.photos.forEach(x=>{
      if(x!==p && !x.del && x.mission==='mid' && x.by===p.by) 사진지우기(x);

  // 같은 칸에 이미 사진이 있으면 갈아 끼웁니다.
  if(p.mission==='color' && Number.isInteger(p.cell)){

      if(x!==p && !x.del && x.mission==='color' && x.by===p.by && x.cell===p.cell) 사진지우기(x);
    });
  }
  save(); render();
  if(올리는중) return p;                     // 재시도가 돌고 있으면 거기서 처리합니다
  try{
    const up=await call('upload',{id:p.id,dataUrl,slot:p.slot,
      place:(SLOT(p.slot)||{}).place||p.slot, day:(SLOT(p.slot)||{}).day||1, who:nameOf(me)});

    save(); render();
  }catch(e){ toast('아직 못 올렸습니다. 연결되면 다시 시도합니다'); }

let cropState=null;
function openCrop(file, cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const box=document.getElementById('cropper');
      const cv=document.getElementById('cropcv');
      const V=cv.width=cv.height=340;
      const min=Math.max(V/img.width, V/img.height);
      cropState={img,V,min,scale:min,ox:0,oy:0,cb};
      centerCrop(); box.classList.add('on');
      document.getElementById('zoom').value=100;
      drawCrop();
    };
    img.onerror=()=>toast('이미지를 열지 못했습니다');
    img.src=fr.result;
  };
  fr.onerror=()=>toast('파일을 읽지 못했습니다');
  fr.readAsDataURL(file);
}
function centerCrop(){
  const c=cropState;
  c.ox=(c.V-c.img.width*c.scale)/2;
  c.oy=(c.V-c.img.height*c.scale)/2;
}
function clampCrop(){
  const c=cropState, w=c.img.width*c.scale, h=c.img.height*c.scale;
  c.ox=Math.min(0,Math.max(c.V-w,c.ox));
  c.oy=Math.min(0,Math.max(c.V-h,c.oy));
}
function drawCrop(){
  const c=cropState; if(!c) return;
  const ctx=document.getElementById('cropcv').getContext('2d');
  clampCrop();
  ctx.fillStyle='#2E2620'; ctx.fillRect(0,0,c.V,c.V);
  ctx.drawImage(c.img,c.ox,c.oy,c.img.width*c.scale,c.img.height*c.scale);
}
function zoomCrop(v){
  const c=cropState; if(!c) return;
  const k=c.scale, mid=c.V/2;
  c.scale=c.min*(1+ (v-100)/100*2);          // 100 → 원래 크기, 200 → 3배
  const r=c.scale/k;
  c.ox=mid-(mid-c.ox)*r; c.oy=mid-(mid-c.oy)*r;
  drawCrop();
}
function closeCrop(){ cropState=null; document.getElementById('cropper').classList.remove('on'); }
function doneCrop(){
  const c=cropState; if(!c) return;
  const OUT=900, k=OUT/c.V;
  const out=document.createElement('canvas'); out.width=out.height=OUT;
  const ctx=out.getContext('2d');
  ctx.fillStyle='#FFFDF6'; ctx.fillRect(0,0,OUT,OUT);
  ctx.drawImage(c.img,c.ox*k,c.oy*k,c.img.width*c.scale*k,c.img.height*c.scale*k);
  const url=out.toDataURL('image/jpeg',.82);
  const cb=c.cb; closeCrop(); cb(url);
}

/* ── 이 사진에 그 색이 얼마나 있나 ──────────── */
function rgb2hsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
  if(!d) return [0,0,l];
  const s=d/(1-Math.abs(2*l-1));
  let h;
  if(mx===r)      h=60*(((g-b)/d)%6);
  else if(mx===g) h=60*((b-r)/d+2);
  else            h=60*((r-g)/d+4);
  return [(h+360)%360, s, l];
}
function colorPct(dataUrl, color){
  return new Promise(res=>{
    const img=new Image();
    img.onerror=()=>res(0);
    img.onload=()=>{
      const N=72, c=document.createElement('canvas');
      c.width=c.height=N;
      const ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,N,N);
      let d;
      try{ d=ctx.getImageData(0,0,N,N).data; }catch(e){ return res(0); }
      let hit=0;
      for(let i=0;i<d.length;i+=4){
        const [h,sa,l]=rgb2hsl(d[i],d[i+1],d[i+2]);
        if(sa<.20 || l<.12 || l>.93) continue;      // 무채색·너무 어둡거나 밝은 건 제외
        let dh=Math.abs(h-color.h); if(dh>180) dh=360-dh;
        if(dh<26) hit++;
      }
      res(Math.round(hit/(N*N)*100));
    };
    img.src=dataUrl;
  });
}

/* ═══════════════════════════════════════════════
   5. 날짜 시드 셔플
   ═══════════════════════════════════════════════ */
function mulberry32(a){ return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
};}
function seedOf(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function shuffle(arr,seedStr){
  const rnd=mulberry32(seedOf(seedStr)), a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* 칸 배치. 예전에 찍어 칸 번호가 없는 사진은 빈 칸에 차례로 놓습니다. */
function 칸배치(k){
  const cs=colorShots(k).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const 칸=new Array(CELLS).fill(null), 남은=[];
  cs.forEach(p=>{

    else 남은.push(p);

  남은.forEach(p=>{ const i=칸.indexOf(null); if(i>=0) 칸[i]=p; });
  return 칸;
}

/* 3×3 판. 가운데는 내가 찍은 상대 인물 사진. */
function boardHtml(k, opt){
  opt=opt||{};
  const 칸=칸배치(k), mid=midShot(k);
  let cells=[];
  for(let i=0;i<9;i++){

      cells.push(`<div class="cell mid"${opt.tap?' data-run="칸가운데"':''}>${
        mid?`<img src="${src(mid)}" alt="">`:'가운데<br>인물'}</div>`);
      continue;
    }
    const n=i<4?i:i-1, p=칸[n];
    const 고른칸 = opt.tap && peek.칸===n;
    cells.push(`<div class="cell${고른칸?' 고름':''}"${opt.tap?` data-run="칸누름" data-a="${n}"`:''}>${p

      : `<span style="font-family:'Jua';font-size:15px">${n+1}</span>`}</div>`);

function readiness(){
  const made=(slot,k)=>S.customQ.some(x=>x.slot===slot&&x.by===k);
  return [
    { t:'아침 봉인',         each:k=>SEALS.every(x=>S.seals[x.id]&&S.seals[x.id][k]!=null) },
    { t:'소노캄 문제',       each:k=>made('checkin',k) },
    { t:'읽을거리 문제',     each:k=>made('balhae',k)  },
    { t:'맥주 이름',         each:k=>!!S.beers.names[k] },
    { t:'글에서 문항 만들기', both:()=>S.aiQ.length>0    }
  ].map(r=>Object.assign(r,{
    ok:   r.both? r.both() : (r.each('A')&&r.each('B')),
    미비: r.both? [] : ['A','B'].filter(k=>!r.each(k))
  }));
}
const quizReady = () => readiness().every(r=>r.ok);

function isDone(s){
  switch(s.type){
    case 'seal':    return SEALS.every(x=>S.seals[x.id]&&S.seals[x.id][me]!=null);
    case 'capture': return s.noAsk ? photosOf(s.id,{by:me}).length>0
                                   : S.customQ.some(q=>q.slot===s.id&&q.by===me);
    case 'ai':      return S.aiQ.length>0;
    case 'brew':    return !!S.beers.names[me];
    case 'show':    return queue().length>0 && S.show.i>=queue().length;
    case 'color':   return colorShots(me).length>=CELLS && !!midShot(me);
    case 'warm':    return WARM.every(w=>S.warm[w.id]&&S.warm[w.id][me]!=null);
    case 'finale':  return !!S.finale.opened;
  }
  return false;
}

/* ── 답 맞춰보기 ─────────────────────────────
   띄어쓰기·문장부호·대소문자는 무시하고, 조금 달라도 인정합니다.
   숫자로 답하는 문제는 가장 가까운 사람이 이깁니다.
   ───────────────────────────────────────────── */
function norm(v){
  return String(v??'').normalize('NFC').toLowerCase()
    .replace(/[\s\u200b\u00a0]/g,'')
    .replace(/[.,!?~·・…"'\u2018\u2019\u201c\u201d()\[\]{}\-_/\\]/g,'');
}
function lev(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function similar(a,b){
  const x=norm(a), y=norm(b);
  if(!x||!y) return false;
  if(x===y) return true;                                  // 띄어쓰기만 다른 경우
  if(y.length>=2 && (x.includes(y)||y.includes(x))) return true;   // 한쪽이 더 자세히 쓴 경우
  // 짧은 답일수록 비율 기준이 가혹해서, 글자 수로 허용치를 정합니다
  const d=lev(x,y), L=Math.max(x.length,y.length);
  const 허용 = L<=4 ? 1 : L<=8 ? 2 : Math.floor(L*0.3);
  return d<=허용;
}
function numOf(v){
  const t=String(v??'').replace(/[,\s]/g,'');
  if(/[만천]/.test(t)){                       // '2만', '1만8천' 처럼 적어도 알아듣게
    let sum=0, m;
    if((m=t.match(/(\d*)만/)))  sum += (m[1]? Number(m[1]) : 1)*10000;
    if((m=t.match(/(\d+)천/)))  sum += Number(m[1])*1000;
    if(sum) return sum;
  }
  const m=t.match(/-?\d+(\.\d+)?/);
  return m? Number(m[0]) : null;
}
/* 사람별로 맞았는지 { A:true, B:false } */
function hitMap(truth, ans, need){
  const t=numOf(truth), ns=need.map(k=>numOf(ans[k])), out={};
  if(t!=null && ns.every(n=>n!=null)){            // 숫자 → 가장 가까운 쪽
    const gap=ns.map(n=>Math.abs(n-t)), best=Math.min(...gap);
    need.forEach((k,i)=>out[k]= gap[i]===best);
  }else{
    need.forEach(k=>out[k]= similar(ans[k],truth));
  }
  return out;
}
/* 'A' | 'B' | 'both' | 'none' */
function autoGrade(truth, ans, need){
  const h=hitMap(truth,ans,need), hit=need.filter(k=>h[k]);
  if(!hit.length) return 'none';
  if(hit.length===need.length && need.length>1) return 'both';
  return hit[0];
}
/* 답 한 줄 */
function 답줄(라벨, 값, 맞음){
  return `<div class="answer ${맞음===true?'ok':맞음===false?'no':''}">
    <b>${esc(라벨)}</b>${맞음!=null?`<span class="mk">${맞음?'정답':'아쉽'}</span>`:''}

/* ── 퀴즈: 한 문제씩 ─────────────────────────── */
function queue(){
  const out=[];
  S.customQ.forEach(q=>out.push({id:q.id,kind:'free',text:q.q,truth:q.a,by:q.by,from:placeOf(q.slot)}));
  S.aiQ.forEach((q,i)=>out.push({id:'ai'+i,kind:'choice',text:q.q,choices:q.choices,truth:q.answer,from:placeOf('balhae')}));
  const day1=TRIP.filter(t=>t.day===1).map(t=>t.id);
  const pool=산사진().filter(p=>day1.includes(p.slot));
  shuffle(pool,CONFIG.TRIP_DATE+'blur').slice(0,2).forEach((p,i)=>out.push({
    id:'ph'+i,kind:'photo',text:'이 사진, 어디서 찍었게?',photo:p,truth:placeOf(p.slot),from:'가려진 사진'}));
  if(S.beers.names.A&&S.beers.names.B) out.push({id:'beer',kind:'beer',from:'양조장'});
  SEALS.forEach(x=>out.push({id:'sl_'+x.id,kind:'seal',text:x.q,num:x.num,tip:x.tip,from:'아침 봉인'}));
  return out;
}
function askers(q){
  if(q.kind==='free'||q.kind==='photo') return q.by?[other2(q.by)]:['A','B'];
  if(q.kind==='choice') return ['A','B'];
  return [];
}
const ansOf = qid => S.show.ans[qid]||{};

/* 점수는 따로 저장하지 않습니다. 채점 결과를 세면 되니까요.
   두 폰이 각자 더하다 어긋날 일이 없어집니다. */
function 점수(){
  const sc={A:0,B:0};
  Object.keys(S.show.graded||{}).forEach(k=>{
    const g=S.show.graded[k], pt=점수몫(k);
    if(g==='both'){ sc.A+=pt; sc.B+=pt; }
    else if(g==='A'||g==='B') sc[g]+=pt;
  });
  return sc;
}

function gradeRow(q, truth, ans, need){
  const g=S.show.graded[q.id];

  /* 아직 안 매겼으면 바로 매깁니다. 누가 맞았는지 고르는 단계는 없습니다. */
  if(!g){
    if(q.kind==='choice'){
      const a=ansOf(q.id);
      const auto = a.A===q.truth&&a.B===q.truth?'both' : a.A===q.truth?'A' : a.B===q.truth?'B' : 'none';
      setTimeout(()=>grade(q.id,auto),0);
    }else{
      const t = truth!==undefined? truth : q.truth;
      setTimeout(()=>grade(q.id, autoGrade(t, ans||ansOf(q.id), need||askers(q))),0);
    }
    return '';
  }

  /* 결과 */
  const pt=점수몫(q.id);
  const 문구 = g==='none' ? '둘 다 아쉽습니다'
             : g==='both' ? '둘 다 정답 🎉  +'+pt
             : esc(nameOf(g))+' 정답  +'+pt;
  let h=`<p class="center jua" style="font-size:19px;margin:16px 0 0">${문구}</p>`;

  /* 판정이 마음에 안 들 때만 펼칩니다 */
  if(q.kind!=='choice'){
    h+= peek.fix===q.id
      ? `<p class="muted center" style="margin:12px 0 7px;font-size:12.5px">판정을 바꿉니다</p>
         <div class="row">
           <button data-run="grade" data-a="${q.id}" data-b="A">${esc(nameOf('A'))}</button>
           <button data-run="grade" data-a="${q.id}" data-b="B">${esc(nameOf('B'))}</button></div>
         <div class="row" style="margin-top:9px">
           <button data-run="grade" data-a="${q.id}" data-b="both">둘 다</button>
           <button data-run="grade" data-a="${q.id}" data-b="none">아무도</button></div>`
      : `<p class="center" style="margin:11px 0 0">
           <button style="font-size:12px;padding:7px 13px" data-run="fixGrade" data-a="${q.id}">✎ 판정 고치기</button></p>`;
  }
  return h;
}
function fixGrade(qid){ peek.fix=qid; render(); }
const nextBtn = () => `<button class="denim wide" data-run="nextQ">다음 문제 →</button>`;
function answer(qid,choice){

        <div>입력할 때마다 올리고, 4초마다 받아옵니다</div></div>
      <div class="answer"><b>사진 올리기</b>
        <div>${산사진().filter(p=>!p.fileId&&!p.url).length? 산사진().filter(p=>!p.fileId&&!p.url).length+'장 대기 중':'전부 올렸습니다'}</div></div>
    </div>
    <button class="wide" style="margin-top:11px" data-run="지금동기화">🔄 지금 주고받기</button>
    <button class="wide" style="margin-top:8px" data-run="leave">나가기</button>
    <button class="wide" style="margin-top:9px" data-run="wipe">전부 지우기</button></div>`;
}
function 지난시간(ts){
  const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  return s<60? s+'초' : s<3600? Math.round(s/60)+'분' : Math.round(s/3600)+'시간';
}
/* 평소엔 알아서 돕니다. 이건 지금 당장 시키는 버튼이에요.
   내 기록 올리기 → 밀린 사진 올리기 → 상대 기록 받아오기 */
async function 지금동기화(){
  if(!CONFIG.API_URL) return toast('서버가 설정되지 않았습니다');
  toast('주고받는 중…');
  const 전=S.photos.length;
  await push(); await retryUploads(); await pull(); render();
  const 늘어난것=S.photos.length-전;
  toast(늘어난것>0? '상대 사진 '+늘어난것+'장을 받았습니다' : '최신입니다');
}
function leave(){ S.names[me]=''; me=null; store.set('me',''); skipWait=false; save(); render(); }
function wipe(){ if(confirm('사진과 점수까지 전부 지웁니다. 계속할까요?')){ S=blank(); me=null; store.set('me',''); save(); render(); } }

/* 자르기 창 끌기 */
(function(){
  const cv=document.getElementById('cropcv');
  let drag=false,lx=0,ly=0;
  cv.addEventListener('pointerdown',e=>{ if(!cropState)return;
    drag=true; lx=e.clientX; ly=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!drag||!cropState)return;
    const r=cv.getBoundingClientRect(), k=cropState.V/r.width;
    cropState.ox+=(e.clientX-lx)*k; cropState.oy+=(e.clientY-ly)*k;
    lx=e.clientX; ly=e.clientY; drawCrop(); });
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=false));
})();

사진불러오기();
render(); pull();

</script>
