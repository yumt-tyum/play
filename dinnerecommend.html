<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘 저녁 뭐 먹지?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E7;
    --cream-deep:#F0E6D4;
    --sage:#9CB380;
    --peach:#F4C284;
    --coral:#E8927C;
    --ink:#4A4238;
    --ink-soft:#8A7F6E;
    --shadow-raise: 6px 6px 14px rgba(180,160,130,0.35), -6px -6px 14px rgba(255,255,255,0.9);
    --shadow-inset: inset 4px 4px 8px rgba(180,160,130,0.35), inset -4px -4px 8px rgba(255,255,255,0.85);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--cream);
    font-family:'Gowun Dodum', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px;
  }
  .app{ width:100%; max-width:480px; }
  h1{
    font-family:'Jua', sans-serif; font-size:1.9rem; margin:0 0 4px;
    text-align:center; color:var(--ink);
  }
  .sub{ text-align:center; color:var(--ink-soft); font-size:0.92rem; margin-bottom:24px; }

  .card{
    background:var(--cream); border-radius:24px; padding:20px;
    box-shadow:var(--shadow-raise); margin-bottom:20px;
  }
  .card h2{
    font-family:'Jua', sans-serif; font-size:1.1rem; margin:0 0 14px; color:var(--ink);
  }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:9px 16px; border-radius:16px; background:var(--cream);
    box-shadow:var(--shadow-raise); font-size:0.9rem; cursor:pointer;
    border:none; color:var(--ink); transition:transform .12s ease, box-shadow .12s ease;
    font-family:'Gowun Dodum', sans-serif;
  }
  .chip:active{ transform:scale(0.96); box-shadow:var(--shadow-inset); }
  .chip.on{ background:var(--sage); color:#fff; box-shadow:var(--shadow-inset); }
  .chip.ingredient.on{ background:var(--peach); color:var(--ink); }

  .add-row{ display:flex; gap:8px; margin-top:14px; }
  .add-row input{
    flex:1; border:none; border-radius:14px; padding:10px 14px;
    background:var(--cream-deep); box-shadow:var(--shadow-inset);
    font-family:'Gowun Dodum', sans-serif; font-size:0.9rem; color:var(--ink);
  }
  .add-row input:focus{ outline:2px solid var(--sage); }
  .btn-small{
    border:none; border-radius:14px; padding:10px 16px; background:var(--sage);
    color:#fff; font-family:'Jua', sans-serif; font-size:0.85rem; cursor:pointer;
    box-shadow:var(--shadow-raise);
  }
  .btn-small:active{ box-shadow:var(--shadow-inset); transform:scale(0.97); }

  .sync-row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .sync-status{ font-size:0.78rem; color:var(--ink-soft); }
  .link-btn{ background:none; border:none; color:var(--ink-soft); font-size:0.78rem; text-decoration:underline; cursor:pointer; }

  .cta{
    width:100%; border:none; border-radius:20px; padding:18px;
    background:var(--coral); color:#fff; font-family:'Jua', sans-serif;
    font-size:1.15rem; cursor:pointer; box-shadow:var(--shadow-raise);
    transition:transform .12s ease;
  }
  .cta:active{ transform:scale(0.97); box-shadow:var(--shadow-inset); }
  .cta:disabled{ opacity:0.6; }

  .result-card{
    background:var(--cream); border-radius:20px; padding:18px; margin-top:14px;
    box-shadow:var(--shadow-raise);
  }
  .result-card h3{ font-family:'Jua', sans-serif; margin:0 0 6px; color:var(--ink); font-size:1.05rem; }
  .result-card p{ margin:4px 0; font-size:0.9rem; line-height:1.5; color:var(--ink); }
  .missing{ font-size:0.82rem; color:var(--coral); margin-top:6px; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:0.88rem; padding:10px 0; }

  .settings-panel{ display:none; }
  .settings-panel.open{ display:block; }
  .settings-panel input{
    width:100%; border:none; border-radius:14px; padding:10px 14px;
    background:var(--cream-deep); box-shadow:var(--shadow-inset);
    font-size:0.85rem; margin-bottom:10px; font-family:'Gowun Dodum', sans-serif;
  }
  .settings-hint{ font-size:0.78rem; color:var(--ink-soft); line-height:1.5; }
</style>
</head>
<body>
<div class="app">
  <h1>오늘 저녁 뭐 먹지?</h1>
  <div class="sub">집에 있는 재료랑 오늘 상황을 알려주면 메뉴를 골라드려요</div>

  <div class="card">
    <h2>🥬 냉장고 재료</h2>
    <div id="ingredientChips" class="chip-row"></div>
    <div class="add-row">
      <input id="newIngredient" placeholder="재료 추가 (예: 두부)" />
      <button class="btn-small" onclick="addIngredient()">추가</button>
    </div>
    <div class="sync-row">
      <span class="sync-status" id="syncStatus">기기에 저장됨</span>
      <button class="link-btn" onclick="toggleSettings()">구글시트 연동 설정</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <input id="sheetUrl" placeholder="Apps Script 웹앱 URL 붙여넣기" />
      <div class="settings-hint">
        구글시트 한 칸에 재료를 한 줄씩 적어두고, Apps Script를 웹앱으로 배포한 뒤 그 URL을 여기 넣으면 자동으로 불러오고 저장해요.
        아래 안내 코드로 배포하면 됩니다.
      </div>
      <div class="add-row" style="margin-top:10px;">
        <button class="btn-small" onclick="saveSheetUrl()">저장하고 불러오기</button>
        <button class="btn-small" style="background:var(--ink-soft)" onclick="pushToSheet()">지금 시트로 내보내기</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>⏰ 오늘 상황</h2>
    <div class="chip-row" id="timeChips"></div>
    <div class="chip-row" id="peopleChips" style="margin-top:10px;"></div>
    <div class="chip-row" id="moodChips" style="margin-top:10px;"></div>
  </div>

  <button class="cta" id="ctaBtn" onclick="getRecommendation()">오늘 저녁 추천받기</button>

  <div id="results"></div>
</div>

<script>
const TIME_OPTS = ['시간 여유있음','30분 이내','초스피드'];
const PEOPLE_OPTS = ['혼밥','2인','3인 이상'];
const MOOD_OPTS = ['얼큰하게','든든하게','가볍게','특별하게'];

let ingredients = [];
let selected = { time: null, people: null, mood: null };
let sheetUrl = '';

function renderChips(containerId, options, group){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'chip' + (selected[group]===opt ? ' on' : '');
    b.textContent = opt;
    b.onclick = ()=>{ selected[group] = opt; renderChips(containerId, options, group); };
    el.appendChild(b);
  });
}

function renderIngredients(){
  const el = document.getElementById('ingredientChips');
  el.innerHTML = '';
  if(ingredients.length===0){
    el.innerHTML = '<span class="empty">아직 등록된 재료가 없어요</span>';
    return;
  }
  ingredients.forEach((ing,idx)=>{
    const b = document.createElement('button');
    b.className = 'chip ingredient on';
    b.textContent = ing + ' ✕';
    b.onclick = ()=>{ ingredients.splice(idx,1); saveIngredients(); renderIngredients(); };
    el.appendChild(b);
  });
}

async function addIngredient(){
  const input = document.getElementById('newIngredient');
  const val = input.value.trim();
  if(!val) return;
  ingredients.push(val);
  input.value = '';
  await saveIngredients();
  renderIngredients();
}

async function saveIngredients(){
  try{
    await window.storage.set('ingredients', JSON.stringify(ingredients), false);
  }catch(e){ console.error('저장 실패', e); }
  document.getElementById('syncStatus').textContent = '기기에 저장됨';
  if(sheetUrl) pushToSheet();
}

async function loadIngredients(){
  try{
    const r = await window.storage.get('ingredients', false);
    if(r && r.value) ingredients = JSON.parse(r.value);
  }catch(e){ ingredients = []; }
  renderIngredients();
}

function toggleSettings(){
  document.getElementById('settingsPanel').classList.toggle('open');
}

async function saveSheetUrl(){
  const val = document.getElementById('sheetUrl').value.trim();
  if(!val) return;
  sheetUrl = val;
  try{ await window.storage.set('sheetUrl', val, false); }catch(e){}
  await pullFromSheet();
}

async function loadSheetUrl(){
  try{
    const r = await window.storage.get('sheetUrl', false);
    if(r && r.value){
      sheetUrl = r.value;
      document.getElementById('sheetUrl').value = sheetUrl;
    }
  }catch(e){}
}

async function pullFromSheet(){
  if(!sheetUrl) return;
  document.getElementById('syncStatus').textContent = '시트에서 불러오는 중...';
  try{
    const res = await fetch(sheetUrl + '?action=list');
    const data = await res.json();
    if(Array.isArray(data.ingredients)){
      ingredients = data.ingredients;
      await window.storage.set('ingredients', JSON.stringify(ingredients), false);
      renderIngredients();
      document.getElementById('syncStatus').textContent = '구글시트와 연동됨';
    }
  }catch(e){
    document.getElementById('syncStatus').textContent = '시트 연동 실패 (URL 확인)';
  }
}

async function pushToSheet(){
  if(!sheetUrl) return;
  try{
    await fetch(sheetUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ingredients})
    });
    document.getElementById('syncStatus').textContent = '구글시트에 저장됨';
  }catch(e){
    document.getElementById('syncStatus').textContent = '시트 저장 실패';
  }
}

async function getRecommendation(){
  const btn = document.getElementById('ctaBtn');
  const resultsEl = document.getElementById('results');

  if(ingredients.length===0){
    resultsEl.innerHTML = '<div class="empty">재료를 먼저 몇 개 추가해주세요</div>';
    return;
  }
  if(!selected.time || !selected.people || !selected.mood){
    resultsEl.innerHTML = '<div class="empty">오늘 상황을 모두 골라주세요</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '추천 받는 중...';
  resultsEl.innerHTML = '';

  const prompt = `집에 있는 재료: ${ingredients.join(', ')}
오늘 상황: 시간은 "${selected.time}", 먹는 사람은 "${selected.people}", 원하는 느낌은 "${selected.mood}"

이 재료들을 최대한 활용해서 오늘 저녁에 만들 수 있는 메뉴 3가지를 추천해줘.
반드시 아래 JSON 배열 형식으로만 답해. 다른 설명이나 마크다운 코드블럭 없이 순수 JSON만.
[
  {"name":"메뉴 이름", "reason":"이 상황과 재료에 왜 어울리는지 한 두 문장", "missing":["부족한 재료1","부족한 재료2"]},
  ...
]
missing은 집에 없어서 사야 하는 재료만 적고, 없으면 빈 배열로.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const clean = text.replace(/```json|```/g,'').trim();
    const menus = JSON.parse(clean);

    resultsEl.innerHTML = '';
    menus.forEach(m=>{
      const card = document.createElement('div');
      card.className = 'result-card';
      const missingText = (m.missing && m.missing.length>0)
        ? `<div class="missing">🛒 필요: ${m.missing.join(', ')}</div>`
        : `<div class="missing" style="color:var(--sage)">✓ 지금 있는 재료로 바로 가능</div>`;
      card.innerHTML = `<h3>${m.name}</h3><p>${m.reason}</p>${missingText}`;
      resultsEl.appendChild(card);
    });
  }catch(e){
    resultsEl.innerHTML = '<div class="empty">추천을 받아오지 못했어요. 다시 시도해주세요.</div>';
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = '오늘 저녁 추천받기';
  }
}

(async function init(){
  renderChips('timeChips', TIME_OPTS, 'time');
  renderChips('peopleChips', PEOPLE_OPTS, 'people');
  renderChips('moodChips', MOOD_OPTS, 'mood');
  await loadSheetUrl();
  if(sheetUrl){ await pullFromSheet(); } else { await loadIngredients(); }
})();
</script>
</body>
</html>
